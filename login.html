<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion | Bible de Bloc</title>

  <!-- 1. Framework -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- 2. CDS tokens -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>

  <!-- 3. CDS overrides globaux -->
  <link href="css/cds-overrides.css" rel="stylesheet"/>

  <!-- 4. CSS spécifique login -->
  <link href="css/login-ui.css" rel="stylesheet"/>
</head>
<body class="login-bg">

<!-- ═══════════════════════════════════════════════════
     CARD PRINCIPALE
════════════════════════════════════════════════════ -->
<div class="card login-card">
  <div class="card-body">

    <!-- Header -->
    <div class="text-center mb-3">
      <div class="login-icon-wrap">
        <i class="bi bi-clipboard2-pulse fs-3 text-white"></i>
      </div>
      <h4 class="fw-bold mb-1">Bible de Bloc</h4>
      <p class="text-muted small mb-0">Bloc ortho-neurochirurgie</p>
    </div>

    <!-- Alerte (erreur / succès) -->
    <div id="alertBox" class="alert alert-login d-none mb-3" role="alert" aria-live="polite"></div>

    <!-- Onglets -->
    <ul class="nav login-tabs mb-0" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tabLoginBtn" role="tab"
                aria-selected="true" aria-controls="panelLogin"
                data-tab="login">
          Connexion
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tabRegisterBtn" role="tab"
                aria-selected="false" aria-controls="panelRegister"
                data-tab="register">
          Inscription
        </button>
      </li>
    </ul>

    <!-- ── PANNEAU CONNEXION ── -->
    <div id="panelLogin" role="tabpanel" aria-labelledby="tabLoginBtn">
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" class="form-control" id="loginEmail"
               placeholder="votre@email.com" autocomplete="email"/>
      </div>
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label mb-0" for="loginPassword">Mot de passe</label>
          <button class="btn-forgot" id="btnForgot" type="button">Mot de passe oublié ?</button>
        </div>
        <div class="cds-eye-wrap">
          <input type="password" class="form-control" id="loginPassword"
                 placeholder="••••••••" autocomplete="current-password"/>
          <button class="cds-btn-eye" id="eyeLoginBtn" type="button"
                  aria-label="Afficher / masquer le mot de passe">
            <i class="bi bi-eye" id="eyeLoginIcon"></i>
          </button>
        </div>
      </div>
      <button id="btnLogin" class="btn btn-primary w-100 mb-3" type="button">
        <span id="btnLoginText">Se connecter</span>
        <span id="btnLoginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
              role="status" aria-hidden="true"></span>
      </button>
    </div>


    <!-- ── PANNEAU MOT DE PASSE OUBLIÉ ── -->
    <div id="panelForgot" class="d-none" role="tabpanel">
      <div class="forgot-back mb-3">
        <button class="btn-back" id="btnBackToLogin" type="button">
          <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
        </button>
      </div>
      <p class="text-muted small mb-3">
        Saisissez votre email pour recevoir un lien de réinitialisation.<br/>
        <span class="text-warning-emphasis small">
          <i class="bi bi-info-circle me-1"></i>En environnement local, utilisez <strong>Ctrl+Shift+A</strong> à la place.
        </span>
      </p>
      <div class="mb-4">
        <label class="form-label" for="forgotEmail">Email</label>
        <input type="email" class="form-control" id="forgotEmail"
               placeholder="votre@email.com" autocomplete="email"/>
      </div>
      <button id="btnSendReset" class="btn btn-primary w-100" type="button">
        <span id="btnSendResetText">Envoyer le lien</span>
        <span id="btnSendResetSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
              role="status" aria-hidden="true"></span>
      </button>
    </div>
    <!-- ── PANNEAU INSCRIPTION ── -->
    <div id="panelRegister" class="d-none" role="tabpanel" aria-labelledby="tabRegisterBtn">
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label" for="regPrenom">Prénom</label>
          <input type="text" class="form-control" id="regPrenom"
                 placeholder="Marie" autocomplete="given-name"/>
        </div>
        <div class="col-6">
          <label class="form-label" for="regNom">Nom</label>
          <input type="text" class="form-control" id="regNom"
                 placeholder="Dupont" autocomplete="family-name"/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="regFonction">Fonction</label>
        <select class="form-select" id="regFonction">
          <option value="infirmier">Infirmier(ère)</option>
          <option value="medecin">Médecin</option>
          <option value="cadre">Cadre</option>
          <option value="aide-soignant">Aide-soignant(e)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="regEmail">Email</label>
        <input type="email" class="form-control" id="regEmail"
               placeholder="votre@email.com" autocomplete="email"/>
      </div>
      <div class="mb-4">
        <label class="form-label" for="regPassword">Mot de passe</label>
        <div class="cds-eye-wrap">
          <input type="password" class="form-control" id="regPassword"
                 placeholder="••••••••" autocomplete="new-password"/>
          <button class="cds-btn-eye" id="eyeRegisterBtn" type="button"
                  aria-label="Afficher / masquer le mot de passe">
            <i class="bi bi-eye" id="eyeRegisterIcon"></i>
          </button>
        </div>
        <p class="password-hint">Minimum 8 caractères</p>
      </div>
      <button id="btnRegister" class="btn btn-primary w-100" type="button">
        <span id="btnRegisterText">S'inscrire</span>
        <span id="btnRegisterSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
              role="status" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Mode démo discret -->
    <div class="demo-link-wrap">
      <button class="btn-demo" id="btnDemo" type="button">
        <i class="bi bi-eye"></i>
        <span>Aperçu démo</span>
      </button>
    </div>

  </div><!-- /card-body -->
</div><!-- /card -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

  // ── Helpers UI ───────────────────────────────────────────────────────
  function showAlert(msg, type = 'danger') {
    const el = document.getElementById('alertBox');
    el.className = `alert alert-login alert-${type} mb-3 d-flex align-items-start gap-2`;
    const icon = type === 'danger' ? 'bi-exclamation-circle-fill' : 'bi-check-circle-fill';
    el.innerHTML = `<i class="bi ${icon} flex-shrink-0 mt-1"></i><span>${msg}</span>`;
    el.classList.remove('d-none');
  }

  function hideAlert() {
    document.getElementById('alertBox').classList.add('d-none');
  }

  function setLoading(btnId, textId, spinnerId, loading, label) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    document.getElementById(textId).textContent = label;
    document.getElementById(spinnerId).classList.toggle('d-none', !loading);
  }

  // ── Traduction erreurs Supabase ──────────────────────────────────────
  function translateError(msg) {
    const m = (msg || '').toLowerCase();
    if (m.includes('invalid login credentials'))              return 'Email ou mot de passe incorrect.';
    if (m.includes('email not confirmed'))                    return 'Veuillez confirmer votre email avant de vous connecter.';
    if (m.includes('user not found'))                         return 'Aucun compte trouvé avec cet email.';
    if (m.includes('too many requests') || m.includes('rate limit'))
                                                              return 'Trop de tentatives. Réessayez dans quelques minutes.';
    if (m.includes('already registered'))                     return 'Cet email est déjà utilisé. Veuillez vous connecter.';
    if (m.includes('weak password') || m.includes('password'))
                                                              return 'Le mot de passe ne respecte pas les critères de sécurité.';
    if (m.includes('network') || m.includes('fetch'))         return 'Erreur réseau. Vérifiez votre connexion internet.';
    return msg;
  }

  // ── Toggle mot de passe visible ──────────────────────────────────────
  function bindEyeToggle(inputId, iconId, btnId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const isHidden = input.type === 'password';
      input.type  = isHidden ? 'text' : 'password';
      icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }

  bindEyeToggle('loginPassword',   'eyeLoginIcon',    'eyeLoginBtn');
  bindEyeToggle('regPassword',     'eyeRegisterIcon', 'eyeRegisterBtn');

  // ── Onglets ──────────────────────────────────────────────────────────
  function showPanel(panel) {
    ['panelLogin', 'panelRegister', 'panelForgot'].forEach(id => {
      document.getElementById(id).classList.toggle('d-none', id !== panel);
    });
    const isLogin    = panel === 'panelLogin';
    const isRegister = panel === 'panelRegister';
    document.getElementById('tabLoginBtn').classList.toggle('active', isLogin);
    document.getElementById('tabRegisterBtn').classList.toggle('active', isRegister);
    document.getElementById('tabLoginBtn').setAttribute('aria-selected', isLogin);
    document.getElementById('tabRegisterBtn').setAttribute('aria-selected', isRegister);
    hideAlert();
  }

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      showPanel(btn.dataset.tab === 'login' ? 'panelLogin' : 'panelRegister');
    });
  });

  // ── Mot de passe oublié ──────────────────────────────────────────────
  document.getElementById('btnForgot').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (email) document.getElementById('forgotEmail').value = email;
    showPanel('panelForgot');
  });

  document.getElementById('btnBackToLogin').addEventListener('click', () => {
    showPanel('panelLogin');
  });

  document.getElementById('btnSendReset').addEventListener('click', async () => {
    hideAlert();
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email || !email.includes('@')) {
      showAlert('Email invalide.');
      return;
    }
    setLoading('btnSendReset', 'btnSendResetText', 'btnSendResetSpinner', true, 'Envoi…');
    const redirectTo = window.location.origin
      + window.location.pathname.replace('login.html', '')
      + 'reset-password.html';
    const { error } = await window.bdb.auth.resetPasswordForEmail(email, { redirectTo });
    setLoading('btnSendReset', 'btnSendResetText', 'btnSendResetSpinner', false, 'Envoyer le lien');
    if (error) {
      showAlert(translateError(error.message));
    } else {
      showAlert(
        'Lien envoyé. Vérifiez votre boîte mail et cliquez le lien pour réinitialiser votre mot de passe.<br>' +
        '<span class="small">En local : utilisez <strong>Ctrl+Shift+A</strong> → admin bootstrap.</span>',
        'success'
      );
    }
  });

  document.getElementById('forgotEmail').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnSendReset').click();
  });

  // ── Connexion ────────────────────────────────────────────────────────
  async function handleLogin() {
    hideAlert();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email)               { showAlert('Email requis.'); return; }
    if (!email.includes('@')) { showAlert('Email invalide.'); return; }
    if (!password)            { showAlert('Mot de passe requis.'); return; }
    if (password.length < 8)  { showAlert('Le mot de passe doit faire au moins 8 caractères.'); return; }

    setLoading('btnLogin', 'btnLoginText', 'btnLoginSpinner', true, 'Connexion…');

    const { data, error } = await window.bdb.auth.signInWithPassword({ email, password });

    if (error) {
      showAlert(translateError(error.message));
      setLoading('btnLogin', 'btnLoginText', 'btnLoginSpinner', false, 'Se connecter');
      return;
    }

    // Vérifier approbation compte
    const { data: profile } = await window.bdb
      .from('profiles_directory')
      .select('approved')
      .eq('user_id', data.user.id)
      .maybeSingle();

    if (profile && profile.approved === false) {
      window.location.href = 'pending.html';
      return;
    }

    window.location.href = 'index.html';
  }

  // ── Inscription ──────────────────────────────────────────────────────
  async function handleRegister() {
    hideAlert();
    const prenom   = document.getElementById('regPrenom').value.trim();
    const nom      = document.getElementById('regNom').value.trim();
    const fonction = document.getElementById('regFonction').value;
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    if (!prenom || prenom.length < 2)   { showAlert('Le prénom doit faire au moins 2 caractères.'); return; }
    if (!nom    || nom.length < 2)      { showAlert('Le nom doit faire au moins 2 caractères.'); return; }
    if (!email  || !email.includes('@')){ showAlert('Email invalide.'); return; }
    if (password.length < 8)            { showAlert('Le mot de passe doit faire au moins 8 caractères.'); return; }

    setLoading('btnRegister', 'btnRegisterText', 'btnRegisterSpinner', true, 'Inscription…');

    const name     = `${prenom} ${nom}`;
    const initials = (prenom.charAt(0) + nom.charAt(0)).toUpperCase();

    const { error } = await window.bdb.auth.signUp({
      email, password,
      options: {
        emailRedirectTo: window.location.origin + '/index.html',
        data: { name, initials, nom, prenom, fonction },
      },
    });

    setLoading('btnRegister', 'btnRegisterText', 'btnRegisterSpinner', false, "S'inscrire");

    if (error) {
      showAlert(translateError(error.message));
      return;
    }

    showAlert('Inscription réussie ! Vérifiez votre email pour confirmer votre compte.', 'success');
    ['regEmail', 'regPassword', 'regPrenom', 'regNom'].forEach(id => {
      document.getElementById(id).value = '';
    });
  }

  // ── Mode démo ────────────────────────────────────────────────────────
  function activateDemoMode() {
    sessionStorage.setItem('demo_mode', 'true');
    window.location.href = 'index.html';
  }

  document.getElementById('btnDemo').addEventListener('click', activateDemoMode);

  // Ctrl+Shift+D — démo
  // Ctrl+Shift+A — admin bootstrap (discret, pas affiché)
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'D') {
      e.preventDefault();
      activateDemoMode();
    }
    if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'A') {
      e.preventDefault();
      window.location.href = 'admin-bootstrap.html';
    }
  });

  // ── Câblage boutons submit ────────────────────────────────────────────
  document.getElementById('btnLogin').addEventListener('click', handleLogin);
  document.getElementById('btnRegister').addEventListener('click', handleRegister);

  // Enter sur les champs password → submit
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('regPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleRegister();
  });
  document.getElementById('loginEmail').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus();
  });

  // ── Init : si déjà connecté → index ──────────────────────────────────
  (async () => {
    const session = await window.bdbGetSession();
    if (session) { window.location.href = 'index.html'; }
  })();

});
</script>
</body>
</html>
