<!--
  PROJECT  : Des Blocs & Moi (DBM)
  FILE     : session-expiree.html
  MODULE   : Racine
  DATE     : 2026-04-13
  AUTEUR   : Manu + Claude
  RÔLE     : Page affichée après auto-logout inactivité (30 min — R3-AUTH-03).
             Standalone — zéro Supabase, zéro bdb-shell.
             Redirige vers login.html avec ?redirect= pour retour à la page d'origine.
  USAGE    : Redirect depuis le shell auth DBM (_doLogout) quand loginMode='redirect'.
  CHAÎNE CSS :
    1. Bootstrap 5.3.2
    2. Bootstrap Icons 1.11.1
    3. theme.css (CDN menywise/DBM hash figé)
-->
<!DOCTYPE html>
<!-- DBM | Surface: SYSTEME | Auth: aucune | Shell: non -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="js/bdb-pwa.js"></script>
  <title>Session expirée | Des Blocs &amp; Moi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- DBM theme (remplace theme-base + cds-overrides) -->
  <link href="./css/dbm-theme.css" rel="stylesheet"/>
  <link href="./css/bdb-ui-kit.css" rel="stylesheet"/><style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bs-light); }
    .expired-card {
      max-width: 440px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .expired-icon { font-size: 3.5rem; color: var(--bs-secondary); }
  </style>
</head>
<body>
  <div class="expired-card">

    <i class="bi bi-clock-history expired-icon d-block mb-4"></i>

    <h1 class="h3 fw-bold mb-2">Session expirée</h1>
    <p class="text-muted mb-4">
      30 minutes sans activité — ta session a été fermée automatiquement.
      C'est une mesure de sécurité sur les postes partagés du bloc.
    </p>

    <div class="alert alert-info d-flex align-items-center gap-2 text-start mb-4">
      <i class="bi bi-shield-check flex-shrink-0 text-info"></i>
      <span class="small">
        Aucune donnée n'a été perdue. Tu peux te reconnecter et reprendre là où tu en étais.
      </span>
    </div>

    <a href="login.html" class="btn btn-module btn-lg w-100 mb-3" id="btnReconnect">
      <i class="bi bi-box-arrow-in-right me-2"></i>Se reconnecter
    </a>

    <p class="text-muted small mb-0">
      Tu peux aussi
      <a href="index.html" class="text-muted">revenir au portail</a>.
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Récupérer l'URL d'origine si passée en paramètre ?redirect=
    // et la passer au login pour retour automatique après reconnexion
    (function () {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect');
      var btn = document.getElementById('btnReconnect');
      if (redirect && btn) {
        btn.href = 'login.html?redirect=' + encodeURIComponent(redirect);
      }
    })();
  </script>
</body>
</html>
