<!DOCTYPE html>
<!-- BDB | Surface: L3-CREATEUR | Auth: isCreator | Shell: non -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atelier — Portail L3</title>

  <!-- CHAÎNE CSS CDS — ORDRE STRICT (CONV-CHAIN-E) · zéro CSS module (§9.2 T-02 Option B) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@63905396c73b061f336f8f5178d738627bca601c/theme-base.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
</head>
<body>

  <div id="wrapper" class="d-flex align-items-stretch flex-column min-vh-100">

    <!-- SHELL BDB BACK OFFICE — PREMIER ENFANT DE #wrapper (INTERDIT-E1) -->
    <div id="bdb-shell"
         data-module-title="Atelier"
         data-module-icon="bi-tools"
         data-root-path="../../"
         data-login-mode="modal"
         data-shell-kind="backoffice">
    </div>

    <div id="wrapper_content" class="d-flex flex-fill">
      <main id="middle" class="flex-fill">
        <div class="container-fluid p-3 p-md-4 p-lg-5">

          <!-- HEADER DE PAGE -->
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
            <div>
              <h1 class="h3 fw-bold mb-1 d-flex align-items-center gap-2">
                <i class="bi bi-tools text-primary"></i>Atelier — Portail L3
              </h1>
              <p class="text-muted mb-0">Outils Créateur · Gouvernance, diagnostic et alimentation du socle.</p>
            </div>
          </div>

          <!-- MARQUEUR NAV (lu par atelier-nav.js — convention module-nom, analogue conseil-top) -->
          <div id="atelier-top" data-page="index" class="d-none"></div>

          <!-- STATE : LOADING (skeleton — doctrine §8.6) -->
          <div id="at-loading">
            <div class="card bo-card mb-4">
              <div class="card-body">
                <div class="placeholder-glow">
                  <span class="placeholder col-4 mb-2"></span>
                  <span class="placeholder col-8 mb-2"></span>
                  <span class="placeholder col-6"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- STATE : ACCESS DENIED (isCreator required) -->
          <div id="at-denied" class="d-none">
            <div class="card bo-card bo-accent-danger">
              <div class="card-body text-center py-5">
                <div class="bo-state-icon bg-danger-subtle text-danger">
                  <i class="bi bi-shield-lock"></i>
                </div>
                <h2 class="h5 fw-bold mb-2">Accès réservé</h2>
                <p class="text-muted mb-0">L'Atelier L3 est réservé au créateur de l'instance.</p>
              </div>
            </div>
          </div>

          <!-- STATE : CONTENT -->
          <div id="at-content" class="d-none">

            <!-- Banner session active (injecté par atelier-app.js) -->
            <div id="at-banner" class="alert alert-light d-flex align-items-center gap-2 mb-4 border">
              <span class="placeholder-glow flex-fill">
                <span class="placeholder col-6"></span>
              </span>
            </div>

            <!-- KPIs terrain -->
            <div class="mb-4">

              <!-- KPI : loading -->
              <div id="at-kpis-loading" class="row g-3">
                <div class="col-6 col-md-4 col-lg-2">
                  <div class="card bo-card h-100"><div class="card-body py-3 placeholder-glow">
                    <span class="placeholder col-6"></span><br><span class="placeholder col-8"></span>
                  </div></div>
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                  <div class="card bo-card h-100"><div class="card-body py-3 placeholder-glow">
                    <span class="placeholder col-6"></span><br><span class="placeholder col-8"></span>
                  </div></div>
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                  <div class="card bo-card h-100"><div class="card-body py-3 placeholder-glow">
                    <span class="placeholder col-6"></span><br><span class="placeholder col-8"></span>
                  </div></div>
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                  <div class="card bo-card h-100"><div class="card-body py-3 placeholder-glow">
                    <span class="placeholder col-6"></span><br><span class="placeholder col-8"></span>
                  </div></div>
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                  <div class="card bo-card h-100"><div class="card-body py-3 placeholder-glow">
                    <span class="placeholder col-6"></span><br><span class="placeholder col-8"></span>
                  </div></div>
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                  <div class="card bo-card h-100"><div class="card-body py-3 placeholder-glow">
                    <span class="placeholder col-6"></span><br><span class="placeholder col-8"></span>
                  </div></div>
                </div>
              </div>

              <!-- KPI : error -->
              <div id="at-kpis-error" class="d-none">
                <div class="alert alert-warning d-flex align-items-center gap-2 mb-0">
                  <i class="bi bi-exclamation-triangle flex-shrink-0"></i>
                  <div class="flex-fill small" id="at-kpis-error-msg">Terrain non disponible.</div>
                </div>
              </div>

              <!-- KPI : content (rendu par atelier-app.js) -->
              <div id="at-kpis-content" class="d-none">
                <div id="at-kpis" class="row g-3"></div>
              </div>

            </div>

            <!-- Section outils -->
            <div class="card bo-card mb-4">
              <div class="card-header bo-header-tint">
                <i class="bi bi-grid-3x2-gap-fill text-primary me-2"></i>Outils créateur
              </div>
              <div class="card-body">
                <div id="at-outils" class="row g-3"></div>
              </div>
            </div>

          </div><!-- /at-content -->

        </div><!-- /container-fluid -->
      </main>
    </div><!-- /wrapper_content -->

    <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
      <small>&copy; 2026 <span class="app-nom fw-semibold"></span> — Atelier L3
        <span class="badge bg-light text-dark border ms-2">CDS Compliant</span>
      </small>
    </footer>

  </div><!-- /wrapper -->

  <!-- CHAÎNE JS BDB — ORDRE STRICT (CONV-CHAIN-E) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/bdb-ui.js"></script>
  <script src="../../js/bdb-invite-guard.js"></script>
  <script src="../../js/bdb-shell.js"></script>
  <script src="atelier-nav.js"></script>
  <script src="atelier-app.js"></script>
</body>
</html>
