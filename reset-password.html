<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nouveau mot de passe | Bible de Bloc</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <link href="css/cds-overrides.css" rel="stylesheet"/>
  <link href="css/login-ui.css" rel="stylesheet"/>
</head>
<body class="login-bg">

<div class="card login-card">
  <div class="card-body">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="login-icon-wrap">
        <i class="bi bi-key fs-3 text-white"></i>
      </div>
      <h5 class="fw-bold mb-1">Nouveau mot de passe</h5>
      <p class="text-muted small mb-0">Bible de Bloc · Bloc ortho-neurochirurgie</p>
    </div>

    <!-- Alerte -->
    <div id="alertBox" class="alert alert-login d-none mb-3" role="alert" aria-live="polite"></div>

    <!-- Panneau saisie (affiché si token valide) -->
    <div id="panelForm">
      <div class="mb-3">
        <label class="form-label" for="newPassword">Nouveau mot de passe</label>
        <div class="input-eye-wrap">
          <input type="password" class="form-control" id="newPassword"
                 placeholder="••••••••" autocomplete="new-password"/>
          <button class="btn-eye" id="eyeNewBtn" type="button"
                  aria-label="Afficher / masquer">
            <i class="bi bi-eye" id="eyeNewIcon"></i>
          </button>
        </div>
        <p class="password-hint">Minimum 8 caractères</p>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
        <div class="input-eye-wrap">
          <input type="password" class="form-control" id="confirmPassword"
                 placeholder="••••••••" autocomplete="new-password"/>
          <button class="btn-eye" id="eyeConfirmBtn" type="button"
                  aria-label="Afficher / masquer">
            <i class="bi bi-eye" id="eyeConfirmIcon"></i>
          </button>
        </div>
      </div>
      <button id="btnReset" class="btn btn-primary w-100" type="button">
        <span id="btnResetText">Enregistrer le mot de passe</span>
        <span id="btnResetSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
              role="status" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Panneau erreur token (affiché si token absent/expiré) -->
    <div id="panelTokenError" class="d-none text-center">
      <div class="mb-3">
        <i class="bi bi-exclamation-circle text-danger" style="font-size:2.5rem;"></i>
      </div>
      <p class="text-muted small mb-3">
        Ce lien est invalide ou a expiré.<br>
        Demandez un nouveau lien depuis la page de connexion.
      </p>
      <a href="login.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
      </a>
    </div>

    <!-- Lien retour discret -->
    <div class="demo-link-wrap">
      <a href="login.html" class="btn-demo text-decoration-none">
        <i class="bi bi-arrow-left"></i>
        <span>Retour à la connexion</span>
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

  // ── Helpers ──────────────────────────────────────────────────────────
  function showAlert(msg, type = 'danger') {
    const el = document.getElementById('alertBox');
    const icon = type === 'danger'  ? 'bi-exclamation-circle-fill'
               : type === 'success' ? 'bi-check-circle-fill'
               : 'bi-info-circle-fill';
    el.className = `alert alert-login alert-${type} mb-3 d-flex align-items-start gap-2`;
    el.innerHTML = `<i class="bi ${icon} flex-shrink-0 mt-1"></i><span>${msg}</span>`;
    el.classList.remove('d-none');
  }

  function setLoading(loading) {
    document.getElementById('btnReset').disabled = loading;
    document.getElementById('btnResetSpinner').classList.toggle('d-none', !loading);
    document.getElementById('btnResetText').textContent = loading ? 'Enregistrement…' : 'Enregistrer le mot de passe';
  }

  function bindEye(inputId, iconId, btnId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }

  bindEye('newPassword',     'eyeNewIcon',     'eyeNewBtn');
  bindEye('confirmPassword', 'eyeConfirmIcon', 'eyeConfirmBtn');

  // ── Vérification du token dans le hash URL ────────────────────────────
  // Supabase redirige vers : reset-password.html#access_token=xxx&type=recovery
  async function init() {
    const hash   = window.location.hash;
    const params = new URLSearchParams(hash.replace('#', '?').replace('#', '&'));
    const type   = params.get('type');
    const token  = params.get('access_token');

    if (type !== 'recovery' || !token) {
      // Essayer via getSession (Supabase PKCE flow)
      const { data: { session } } = await window.bdb.auth.getSession();
      if (!session) {
        document.getElementById('panelForm').classList.add('d-none');
        document.getElementById('panelTokenError').classList.remove('d-none');
        return;
      }
    } else {
      // Établir la session depuis le token du hash
      const { error } = await window.bdb.auth.setSession({
        access_token:  token,
        refresh_token: params.get('refresh_token') || '',
      });
      if (error) {
        document.getElementById('panelForm').classList.add('d-none');
        document.getElementById('panelTokenError').classList.remove('d-none');
        return;
      }
      // Nettoyer le hash de l'URL (sécurité)
      history.replaceState(null, '', window.location.pathname);
    }
  }

  init();

  // ── Submit nouveau mot de passe ───────────────────────────────────────
  document.getElementById('btnReset').addEventListener('click', async () => {
    const pwd     = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!pwd || pwd.length < 8) {
      showAlert('Le mot de passe doit faire au moins 8 caractères.');
      return;
    }
    if (pwd !== confirm) {
      showAlert('Les mots de passe ne correspondent pas.');
      return;
    }

    setLoading(true);

    const { error } = await window.bdb.auth.updateUser({ password: pwd });

    setLoading(false);

    if (error) {
      showAlert(error.message || 'Erreur lors de la mise à jour.');
      return;
    }

    showAlert('Mot de passe mis à jour. Redirection…', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  });

  // Enter → submit
  ['newPassword', 'confirmPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btnReset').click();
    });
  });

});
</script>
</body>
</html>
