<!DOCTYPE html>
<!-- DBM | Surface: APP-RACINE | Auth: login/portail | Shell: non -->
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="js/bdb-pwa.js"></script>
  <title>Nouveau mot de passe | Des Blocs & Moi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- DBM theme (remplace theme-base + cds-overrides) -->
  <link href="./css/dbm-theme.css" rel="stylesheet"/>
  <link href="./css/bdb-ui-kit.css" rel="stylesheet"/><link href="css/login-ui.css" rel="stylesheet"/>
  <style>.reset-token-icon { font-size: 2.5rem; }</style>
</head>
<body>

<div class="card login-card">
  <div class="card-body">

    <div class="text-center mb-4">
      <div class="login-icon-wrap">
        <i class="bi bi-key fs-3 text-white"></i>
      </div>
      <h5 class="fw-bold mb-1">Choisir un nouveau mot de passe</h5>
      <p class="text-muted small mb-0">Des Blocs & Moi · Bloc ortho-neurochirurgie</p>
    </div>

    <div id="alertBox" class="alert alert-login d-none mb-3" role="alert" aria-live="polite"></div>

    <div id="panelForm">
      <div class="mb-3">
        <label class="form-label" for="newPassword">Nouveau mot de passe</label>
        <div class="input-eye-wrap">
          <input type="password" autocomplete="new-password" class="form-control" id="newPassword"
                 placeholder="••••••••"/>
          <button class="btn-eye" id="eyeNewBtn" type="button" aria-label="Afficher / masquer">
            <i class="bi bi-eye" id="eyeNewIcon"></i>
          </button>
        </div>
        <div id="passwordFeedback"></div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
        <div class="input-eye-wrap">
          <input type="password" autocomplete="new-password" class="form-control" id="confirmPassword"
                 placeholder="••••••••"/>
          <button class="btn-eye" id="eyeConfirmBtn" type="button" aria-label="Afficher / masquer">
            <i class="bi bi-eye" id="eyeConfirmIcon"></i>
          </button>
        </div>
      </div>
      <button id="btnReset" class="btn btn-module w-100" type="button">
        <span id="btnResetText">Enregistrer mon mot de passe</span>
        <span id="btnResetSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
              role="status" aria-hidden="true"></span>
      </button>
    </div>

    <div id="panelTokenError" class="d-none text-center">
      <div class="mb-3">
        <i class="bi bi-clock text-warning reset-token-icon"></i>
      </div>
      <p class="text-muted small mb-3">
        Ce lien n\u2019est plus valide \u2014 il a probablement expir\u00e9.<br>
        Pas d\u2019inqui\u00e9tude, il suffit d\u2019en demander un nouveau depuis la page de connexion.
      </p>
      <a href="login.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Retour \u00e0 la connexion
      </a>
    </div>

    <div class="demo-link-wrap">
      <a href="login.html" class="btn-demo text-decoration-none">
        <i class="bi bi-arrow-left"></i>
        <span>Retour \u00e0 la connexion</span>
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/bdb-password-policy.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

  function showAlert(msg, type = 'danger') {
    const el = document.getElementById('alertBox');
    const icon = type === 'danger'  ? 'bi-exclamation-circle-fill'
               : type === 'success' ? 'bi-check-circle-fill'
               : 'bi-info-circle-fill';
    el.className = `alert alert-login alert-${type} mb-3 d-flex align-items-start gap-2`;
    el.innerHTML = `<i class="bi ${icon} flex-shrink-0 mt-1"></i><span>${msg}</span>`;
    el.classList.remove('d-none');
  }

  function setLoading(loading) {
    document.getElementById('btnReset').disabled = loading;
    document.getElementById('btnResetSpinner').classList.toggle('d-none', !loading);
    document.getElementById('btnResetText').textContent = loading ? 'Enregistrement\u2026' : 'Enregistrer mon mot de passe';
  }

  function bindEye(inputId, iconId, btnId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }

  bindEye('newPassword',     'eyeNewIcon',     'eyeNewBtn');
  bindEye('confirmPassword', 'eyeConfirmIcon', 'eyeConfirmBtn');

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('reason') === 'weak') {
    showAlert(
      'Pour renforcer la s\u00e9curit\u00e9 de votre compte, nous vous invitons \u00e0 choisir un nouveau mot de passe plus robuste.',
      'warning'
    );
  }

  const feedbackEl = document.getElementById('passwordFeedback');
  document.getElementById('newPassword').addEventListener('input', function () {
    window.bdbPasswordPolicy.renderFeedback(feedbackEl, this.value);
  });

  async function init() {
    const hash   = window.location.hash;
    const params = new URLSearchParams(hash.replace('#', '?').replace('#', '&'));
    const type   = params.get('type');
    const token  = params.get('access_token');

    if (type !== 'recovery' || !token) {
      const { data: { session } } = await window.bdb.auth.getSession();
      if (!session) {
        if (urlParams.get('reason') !== 'weak') {
          document.getElementById('panelForm').classList.add('d-none');
          document.getElementById('panelTokenError').classList.remove('d-none');
        }
        return;
      }
    } else {
      const { error } = await window.bdb.auth.setSession({
        access_token:  token,
        refresh_token: params.get('refresh_token') || '',
      });
      if (error) {
        document.getElementById('panelForm').classList.add('d-none');
        document.getElementById('panelTokenError').classList.remove('d-none');
        return;
      }
      history.replaceState(null, '', window.location.pathname);
    }
  }

  init();

  document.getElementById('btnReset').addEventListener('click', async () => {
    const pwd     = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    const check = window.bdbPasswordPolicy.validate(pwd);
    if (!check.valid) {
      window.bdbPasswordPolicy.renderFeedback(feedbackEl, pwd);
      feedbackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      showAlert('Quelques crit\u00e8res ne sont pas encore remplis \u2014 jetez un œil aux indications ci-dessous.');
      return;
    }

    if (pwd !== confirm) {
      showAlert('Les deux mots de passe ne correspondent pas encore.');
      return;
    }

    setLoading(true);

    const { error } = await window.bdb.auth.updateUser({ password: pwd });

    setLoading(false);

    if (error) {
      if (window.bdbPasswordPolicy.isWeakPasswordError(error)) {
        showAlert('Ce mot de passe est consid\u00e9r\u00e9 comme trop courant. Essayez d\u2019y ajouter un chiffre ou un caract\u00e8re sp\u00e9cial.');
      } else {
        showAlert(error.message || 'Une erreur est survenue. R\u00e9essayez dans quelques instants.');
      }
      return;
    }

    showAlert('Mot de passe mis \u00e0 jour. Vous allez \u00eatre redirig\u00e9(e)\u2026', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  });

  ['newPassword', 'confirmPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btnReset').click();
    });
  });

});
</script>
</body>
</html>
