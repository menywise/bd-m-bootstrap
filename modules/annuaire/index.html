<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Annuaire Equipe | BDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <link href="annuaire-ui.css" rel="stylesheet"/></head>
<body class="d-flex min-vh-100">


<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- ── SHELL BDB (offcanvas + header — injecté par bdb-shell.js) ── -->
  <div id="bdb-shell"
       data-module-title="Annuaire"
       data-module-icon="bi-people">
  </div>

    <div class="container-fluid p-3 p-md-4 flex-grow-1">

    <div class="annuaire-hero rounded-3 text-white p-4 mb-4 position-relative overflow-hidden">
      <div class="d-flex align-items-center gap-3">
        <i class="bi bi-people-fill fs-2 opacity-75"></i>
        <div>
          <h1 class="h4 fw-bold mb-1">Annuaire Equipe</h1>
          <p class="mb-0 opacity-75 small" id="heroCount">Chargement...</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-3 p-3 mb-4 shadow-sm">
      <div class="position-relative mb-3">
        <i class="bi bi-search search-icon text-secondary annuaire-search-icon"></i>
        <input class="form-control cds-search-input" type="search" id="searchInput" placeholder="Rechercher par nom..." autocomplete="off"/>
      </div>
      <div class="d-flex gap-2 flex-wrap" id="filterChips" role="group" aria-label="Filtrer par fonction">
        <button class="filter-chip active" data-fn="all">Tous</button>
        <button class="filter-chip" data-fn="medecin">Médecins</button>
        <button class="filter-chip" data-fn="cadre">Cadres</button>
        <button class="filter-chip" data-fn="infirmier">Infirmiers</button>
        <button class="filter-chip" data-fn="aide-soignant">Aides-soignants</button>
      </div>
    </div>

    <div id="membersGrid" class="members-grid" aria-live="polite"></div>

    <div id="emptyState" class="d-none d-flex flex-column align-items-center justify-content-center py-5 text-secondary text-center">
      <i class="bi bi-people fs-1 opacity-25 mb-3"></i>
      <h5>Aucun membre trouvé</h5>
      <p class="small" id="emptyMsg">L'annuaire est vide.</p>
    </div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 BDB &mdash; Consensus Design System &mdash;
      <span class="badge bg-light text-dark border">CDS Compliant</span></small>
  </footer>
</main>

<!-- MODALE MEMBRE -->
<div class="modal fade" id="modalMembre" tabindex="-1" aria-labelledby="modalMembreLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable annuaire-modal-membre-dialog">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="visually-hidden" id="modalMembreLabel">Profil membre</h5>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body pt-0 annuaire-modal-membre-body" id="modalMembreBody"></div>
    </div>
  </div>
</div>

<!-- MODALE GANT -->
<div class="modal fade cds-modal-l2" id="modalGant" tabindex="-1" aria-labelledby="modalGantTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable annuaire-modal-equip-dialog">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" id="modalGantTitle">
          <i class="bi bi-hand-index text-primary me-2"></i>Gants
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body" id="modalGantBody">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- MODALE CASAQUE -->
<div class="modal fade cds-modal-l2" id="modalCasaque" tabindex="-1" aria-labelledby="modalCasaqueTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable annuaire-modal-equip-dialog">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" id="modalCasaqueTitle">
          <i class="bi bi-person-badge text-primary me-2"></i>Casaque
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body" id="modalCasaqueBody">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- MODALE CONFIRMATION SUPPRESSION -->
<div class="modal fade cds-modal-l3" id="modalConfirmDelete" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-body p-4">
        <h6 class="fw-bold mb-2">Supprimer cet utilisateur ?</h6>
        <p class="text-secondary small mb-3" id="deleteConfirmMsg"></p>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-danger btn-sm" id="btnConfirmDelete">Supprimer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container position-fixed bottom-0 end-0 p-3 cds-toast-top">
  <div id="annuaireToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2">
        <i class="bi" id="toastIcon"></i>
        <span id="toastMsg"></span>
      </div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fermer"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-shell.js"></script>
<script src="annuaire-app.js"></script>
</body>
</html>
