<!DOCTYPE html>
<!-- DBM | Surface: MODULE | Auth: bdb-shell.js | Shell: oui -->
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="../../js/bdb-pwa.js"></script>
  <title>Arsenal - Des Blocs &amp; Moi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/dbm-theme.css" rel="stylesheet"/>
  <link href="../../css/bdb-ui-kit.css" rel="stylesheet"/>
  <link href="../../css/dbm-module-color.css" rel="stylesheet"/>
  <link href="arsenal-ui.css" rel="stylesheet"/>
  <script src="../../js/bdb-media.js"></script>
  <style>
    :root {
      --module-color: #93c5fd;
      --module-color-strong: #60a5fa;
      --module-color-text: #1e3a8a;
      --module-color-soft: rgba(147, 197, 253, 0.15);
    }
  </style>
</head>
<body class="sidebar-closed">
  <div id="wrapper">
    <div id="bdb-shell"
         data-module-title="Arsenal"
         data-module-icon="bi-box-seam"
         data-root-path="../../"
         data-login-mode="modal"
         data-shell-kind="backoffice"
         data-shell-theme="dbm">
    </div>
    <div id="wrapper_content">
      <div class="app-layout">
        <main class="app-main" id="main-content">
          <div class="app-content" data-module-color="bloc" style="--module-color:#93c5fd;--module-color-strong:#60a5fa;--module-color-text:#1e3a8a;--module-color-soft:rgba(147,197,253,0.15)">
            <section class="app-zone" data-zone="Breadcrumb">
              <nav class="app-breadcrumb" aria-label="Fil d Ariane">
                <a href="../../index.html">Accueil</a>
                <span class="app-breadcrumb-sep"><i class="bi bi-chevron-right"></i></span>
                <span>Arsenal</span>
              </nav>
            </section>
            <section class="app-zone" data-zone="Page Title">
              <div class="p-4 rounded shadow-sm mb-3" style="background:linear-gradient(135deg, #93c5fd 0%, #60a5fa 100%);color:#1e3a8a">
                <h1 class="mb-2 fw-bold"><i class="bi bi-box-seam me-2"></i>Arsenal</h1>
                <p style="opacity:0.75" class="mb-0">Materiel, gants, casaques - inventaire et localisation</p>
              </div>
            </section>
            <section class="app-zone" data-zone="Filters">
              <div style="background:var(--bs-body-bg);border:1px solid var(--bs-border-color);border-radius:.5rem;padding:.75rem 1rem;margin-bottom:1rem">
                <div class="d-flex flex-wrap align-items-center gap-2">
                  <div class="input-group input-group-sm" style="max-width:320px;flex:1 1 240px">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="search" id="mSearch" class="form-control border-start-0" placeholder="Nom, reference, description..." autocomplete="off"/>
                  </div>
                  <select class="form-select form-select-sm" id="mType" style="width:180px" aria-label="Filtre type">
                    <option value="">Tous types</option>
                  </select>
                  <select class="form-select form-select-sm" id="mZoneAnat" style="width:180px" aria-label="Filtre zone anatomique">
                    <option value="">Zone anatomique</option>
                  </select>
                  <select class="form-select form-select-sm" id="mZoneStock" style="width:180px" aria-label="Filtre zone stockage">
                    <option value="">Zone stockage</option>
                  </select>
                  <select class="form-select form-select-sm" id="mStatut" style="width:180px" aria-label="Filtre statut">
                    <option value="">Tous statuts</option>
                    <option value="disponible">Disponible</option>
                    <option value="indisponible">Indisponible</option>
                    <option value="en_reparation">En reparation</option>
                    <option value="manquant">Manquant</option>
                  </select>
                  <select class="form-select form-select-sm" id="mFamille4D" style="width:180px" aria-label="Filtre famille 4D">
                    <option value="">Toutes familles 4D</option>
                    <option value="DMI">DMI - Boite implant</option>
                    <option value="ANCILLAIRES">Ancillaires - Boite metal chirurgien</option>
                    <option value="DM">DM - Sachet / blister</option>
                    <option value="PACKS">Packs - Emballage multi-items</option>
                    <option value="PLIAGES">Pliages - Papier bleu</option>
                    <option value="DOUBLES_SACHETS">Doubles sachets - Papier rose</option>
                  </select>
                  <button class="btn btn-outline-secondary btn-sm" id="mBtnClear" type="button" title="Effacer les filtres">
                    <i class="bi bi-x-lg"></i>
                  </button>
                  <div class="input-group input-group-sm" style="max-width:200px">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-upc text-muted"></i></span>
                    <input type="text" id="mOptimOPM" class="form-control border-start-0" placeholder="Code OptimOPM..." autocomplete="off"/>
                  </div>
                  <button class="btn btn-module btn-sm d-none ms-auto" type="button" id="btnNewMateriel">
                    <i class="bi bi-plus-lg me-1"></i>Materiel
                  </button>
                </div>
              </div>
            </section>
            <section class="app-zone" data-zone="Content">
              <div class="bdb-admin-only d-none mb-3">
                <a href="admin.html" class="btn btn-sm btn-outline-secondary">
                  <i class="bi bi-gear me-1"></i>Administration
                </a>
              </div>
              <ul class="nav nav-tabs mb-3" id="arsenalTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" type="button" data-tab="materiel" role="tab" aria-selected="true">
                    <i class="bi bi-tools me-2"></i>Materiel
                    <span class="badge bg-secondary ms-1" id="countMateriel">-</span>
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" type="button" data-tab="gants" role="tab" aria-selected="false">
                    <i class="bi bi-hand-index-thumb me-2"></i>Gants
                    <span class="badge bg-secondary ms-1" id="countGants">-</span>
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" type="button" data-tab="casaques" role="tab" aria-selected="false">
                    <i class="bi bi-person-badge me-2"></i>Casaques
                    <span class="badge bg-secondary ms-1" id="countCasaques">-</span>
                  </button>
                </li>
              </ul>
              <div id="tab-materiel">
                <div id="arsenalSkeletonMateriel" class="placeholder-glow mb-3">
                  <div class="row g-3">
                    <div class="col-md-6 col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body p-3"><span class="placeholder col-8 rounded mb-2 d-block ars-skel-title"></span><span class="placeholder col-5 rounded ars-skel-line"></span></div></div></div>
                    <div class="col-md-6 col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body p-3"><span class="placeholder col-7 rounded mb-2 d-block ars-skel-title"></span><span class="placeholder col-4 rounded ars-skel-line"></span></div></div></div>
                    <div class="col-md-6 col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body p-3"><span class="placeholder col-9 rounded mb-2 d-block ars-skel-title"></span><span class="placeholder col-6 rounded ars-skel-line"></span></div></div></div>
                  </div>
                </div>
                <div id="materielGrid" class="row g-3"></div>
              </div>
              <div id="tab-gants" class="d-none">
                <div class="app-card mb-3">
                  <div class="app-card-body" style="padding:1rem">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                      <div class="input-group input-group-sm" style="max-width:360px;flex:1 1 240px">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="search" id="gSearch" class="form-control border-start-0" placeholder="Titre, marque, modele..." autocomplete="off"/>
                      </div>
                      <select class="form-select form-select-sm" id="gLatex" style="width:180px" aria-label="Filtre latex">
                        <option value="">Latex / Sans latex</option>
                        <option value="true">Sans latex</option>
                        <option value="false">Avec latex</option>
                      </select>
                      <button class="btn btn-module btn-sm d-none ms-auto" type="button" id="btnNewGant">
                        <i class="bi bi-plus-lg me-1"></i>Gant
                      </button>
                    </div>
                  </div>
                </div>
                <div id="gantsGrid" class="row g-3"></div>
              </div>
              <div id="tab-casaques" class="d-none">
                <div class="app-card mb-3">
                  <div class="app-card-body" style="padding:1rem">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                      <div class="input-group input-group-sm" style="max-width:360px;flex:1 1 240px">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="search" id="cSearch" class="form-control border-start-0" placeholder="Titre, specialite..." autocomplete="off"/>
                      </div>
                      <select class="form-select form-select-sm" id="cRenforcee" style="width:180px" aria-label="Filtre casaque renforcee">
                        <option value="">Standard / Renforcee</option>
                        <option value="true">Renforcee</option>
                        <option value="false">Standard</option>
                      </select>
                      <button class="btn btn-module btn-sm d-none ms-auto" type="button" id="btnNewCasaque">
                        <i class="bi bi-plus-lg me-1"></i>Casaque
                      </button>
                    </div>
                  </div>
                </div>
                <div id="casaquesGrid" class="row g-3"></div>
              </div>
            </section>
          </div>
          <footer class="app-footer">
            <small>&copy; 2026 <span class="app-nom"></span> - Arsenal</small>
          </footer>
        </main>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modalMateriel" tabindex="-1" aria-labelledby="modalMaterielLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered modal-fullscreen-md-down">
      <div class="modal-content">
        <div class="modal-header modal-header-module">
          <h5 class="modal-title" id="modalMaterielLabel">Nouveau materiel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="mFormError" class="alert alert-danger d-none" role="alert"></div>
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold" for="mNom">Nom <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="mNom" placeholder="Nom du materiel" autocomplete="off"/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="mRef">Reference</label>
              <input type="text" class="form-control" id="mRef" placeholder="Ref. catalogue"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormType">Type de materiel</label>
              <select class="form-select" id="mFormType" style="width:180px;max-width:100%">
                <option value="">- Selectionner -</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormStatut">Statut</label>
              <select class="form-select" id="mFormStatut" style="width:180px;max-width:100%">
                <option value="disponible">Disponible</option>
                <option value="indisponible">Indisponible</option>
                <option value="en_reparation">En reparation</option>
                <option value="manquant">Manquant</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormFamille4D">Famille 4D</label>
              <select class="form-select" id="mFormFamille4D" style="width:180px;max-width:100%">
                <option value="">- Selectionner -</option>
                <option value="DMI">DMI - Boite implant labellisee</option>
                <option value="ANCILLAIRES">Ancillaires - Boite metal chirurgien</option>
                <option value="DM">DM - Sachet / blister individuel</option>
                <option value="PACKS">Packs - Emballage multi-items sterile</option>
                <option value="PLIAGES">Pliages - Papier bleu sous plastique</option>
                <option value="DOUBLES_SACHETS">Doubles sachets - Papier rose en casier</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormOptimOPM">Code OptimOPM</label>
              <input type="text" class="form-control" id="mFormOptimOPM" placeholder="Ex: OPM-12345"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormZoneAnat">Zone anatomique</label>
              <select class="form-select" id="mFormZoneAnat" style="width:180px;max-width:100%">
                <option value="">- Selectionner -</option>
              </select>
              <div id="mZoneSuggestion" class="d-none ars-zone-suggestion mt-2 rounded-3 p-2" role="region" aria-label="Suggestion de zone anatomique">
                <div class="small mb-1"><strong>Suggestion de zone :</strong> <span id="mZoneSugZone" class="fw-semibold"></span></div>
                <div class="small mb-1"><strong>Justification :</strong> mot-cle detecte = "<span id="mZoneSugKw" class="fst-italic"></span>"</div>
                <div class="small mb-2"><strong>Statut :</strong> A VALIDER PAR UN HUMAIN</div>
                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-sm btn-module" id="mBtnAppliquerZone"><i class="bi bi-check-lg me-1"></i>Appliquer</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary" id="mBtnIgnorerZone">Ignorer</button>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormZoneStock">Zone de stockage</label>
              <select class="form-select" id="mFormZoneStock" style="width:180px;max-width:100%">
                <option value="">- Selectionner -</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mFormEtagere">Etagere</label>
              <select class="form-select" id="mFormEtagere" style="width:180px;max-width:100%">
                <option value="">- Selectionner -</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="mLocalisation">Localisation (texte libre)</label>
              <input type="text" class="form-control" id="mLocalisation" placeholder="Ex: Armoire 3, tiroir 2"/>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold" for="mDescription">Description</label>
              <textarea class="form-control" id="mDescription" rows="3" placeholder="Description, remarques..."></textarea>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Images <span class="text-muted fw-normal">(max 3)</span></label>
              <div id="mUploadArea" class="ars-upload-area border border-dashed rounded-3 p-3 text-center mb-2" role="button" tabindex="0" aria-label="Zone de depot d images">
                <i class="bi bi-cloud-arrow-up fs-3 text-muted d-block"></i>
                <p class="small text-muted mb-1">Glissez ou cliquez pour selectionner</p>
                <input type="file" id="mFileInput" accept="image/*" multiple class="d-none"/>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="mBtnImages"><i class="bi bi-image me-1"></i>Choisir</button>
              </div>
              <div id="mImagePreviews" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="mPriority" role="switch"/>
                <label class="form-check-label" for="mPriority"><i class="bi bi-fire text-danger me-1"></i>Prioritaire</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-module" id="mBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modalGant" tabindex="-1" aria-labelledby="modalGantLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered modal-fullscreen-md-down">
      <div class="modal-content">
        <div class="modal-header modal-header-module">
          <h5 class="modal-title" id="modalGantLabel">Nouveau gant</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="gFormError" class="alert alert-danger d-none" role="alert"></div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold" for="gTitre">Titre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="gTitre" autocomplete="off"/>
            </div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="gMarque">Marque</label><input type="text" class="form-control" id="gMarque"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="gModele">Modele</label><input type="text" class="form-control" id="gModele"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="gMatiere">Matiere</label><input type="text" class="form-control" id="gMatiere" placeholder="Ex: nitrile, latex, vinyl"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="gTailles">Tailles disponibles</label><input type="text" class="form-control" id="gTailles" placeholder="Ex: 6, 6.5, 7, 7.5, 8"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="gCouleurs">Couleurs disponibles</label><input type="text" class="form-control" id="gCouleurs" placeholder="Ex: bleu, beige"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="gLocalisation">Localisation</label><input type="text" class="form-control" id="gLocalisation"/></div>
            <div class="col-12"><label class="form-label fw-semibold" for="gDescription">Description</label><textarea class="form-control" id="gDescription" rows="2"></textarea></div>
            <div class="col-12"><label class="form-label fw-semibold" for="gRemarques">Remarques d usage</label><textarea class="form-control" id="gRemarques" rows="2"></textarea></div>
            <div class="col-12">
              <label class="form-label fw-semibold">Images <span class="text-muted fw-normal">(max 3)</span></label>
              <div id="gUploadArea" class="ars-upload-area border border-dashed rounded-3 p-3 text-center mb-2" role="button" tabindex="0" aria-label="Zone de depot d images">
                <i class="bi bi-cloud-arrow-up fs-3 text-muted d-block"></i>
                <input type="file" id="gFileInput" accept="image/*" multiple class="d-none"/>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="gBtnImages"><i class="bi bi-image me-1"></i>Choisir</button>
              </div>
              <div id="gImagePreviews" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="gSansLatex" role="switch"/>
                <label class="form-check-label" for="gSansLatex">Sans latex</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-module" id="gBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modalCasaque" tabindex="-1" aria-labelledby="modalCasaqueLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered modal-fullscreen-md-down">
      <div class="modal-content">
        <div class="modal-header modal-header-module">
          <h5 class="modal-title" id="modalCasaqueLabel">Nouvelle casaque</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <div id="cFormError" class="alert alert-danger d-none" role="alert"></div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold" for="cTitre">Titre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="cTitre" autocomplete="off"/>
            </div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="cCategorie">Categorie</label><input type="text" class="form-control" id="cCategorie" placeholder="Ex: sterile, non sterile"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="cSpecialite">Specialite</label><input type="text" class="form-control" id="cSpecialite" placeholder="Ex: orthopedie, cardio"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="cTaille">Taille disponible</label><input type="text" class="form-control" id="cTaille" placeholder="Ex: S, M, L, XL"/></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="cLocalisation">Localisation</label><input type="text" class="form-control" id="cLocalisation"/></div>
            <div class="col-12"><label class="form-label fw-semibold" for="cDescription">Description</label><textarea class="form-control" id="cDescription" rows="2"></textarea></div>
            <div class="col-12"><label class="form-label fw-semibold" for="cRemarques">Remarques d usage</label><textarea class="form-control" id="cRemarques" rows="2"></textarea></div>
            <div class="col-12">
              <label class="form-label fw-semibold">Images <span class="text-muted fw-normal">(max 3)</span></label>
              <div id="cUploadArea" class="ars-upload-area border border-dashed rounded-3 p-3 text-center mb-2" role="button" tabindex="0" aria-label="Zone de depot d images">
                <i class="bi bi-cloud-arrow-up fs-3 text-muted d-block"></i>
                <input type="file" id="cFileInput" accept="image/*" multiple class="d-none"/>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="cBtnImages"><i class="bi bi-image me-1"></i>Choisir</button>
              </div>
              <div id="cImagePreviews" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="cFormRenforcee" role="switch"/>
                <label class="form-check-label" for="cFormRenforcee">Renforcee</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-module" id="cBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
        </div>
      </div>
