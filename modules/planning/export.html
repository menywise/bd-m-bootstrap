<!DOCTYPE html>
<!-- BDB | Surface: MODULE | Auth: bdb-shell.js | Shell: oui -->
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="../../js/bdb-pwa.js"></script>
  <title>Planning — Export</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@63905396c73b061f336f8f5178d738627bca601c/theme-base.css" rel="stylesheet"/>
  <!-- Bootstrap Icons 1.11.1 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <link href="planning-ui.css" rel="stylesheet"/>
</head>

<body>


  <div id="wrapper" class="d-flex align-items-stretch flex-column min-vh-100">

  <!-- INTERDIT-E1 -->
  <div id="bdb-shell"
       data-module-title="Planning — Export"
       data-module-icon="bi-download"
       data-root-path="../../"
       data-login-mode="modal"
       data-shell-kind="backoffice"></div>

  <!-- Sous-navigation Planning -->
  <nav class="bg-white border-bottom px-3 px-md-4 d-print-none" aria-label="Navigation Planning">
    <ul class="nav nav-tabs border-0 flex-nowrap" role="tablist">
      <li class="nav-item" role="presentation"><a href="index.html" class="nav-link"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
      <li class="nav-item" role="presentation"><a href="analytics.html" class="nav-link"><i class="bi bi-graph-up me-1"></i>Analyses</a></li>
      <li class="nav-item bdb-admin-only d-none" role="presentation"><a href="planning.html" class="nav-link"><i class="bi bi-pencil-square me-1"></i>Saisie</a></li>
      <li class="nav-item bdb-admin-only d-none" role="presentation"><a href="export.html" class="nav-link active" aria-current="page"><i class="bi bi-download me-1"></i>Export</a></li>
    </ul>
  </nav>

    <div id="wrapper_content" class="d-flex flex-fill">
      <main id="middle" class="flex-fill">
  <div class="container-xxl py-4 flex-grow-1">

    <div class="bg-primary bg-gradient p-4 rounded shadow-sm text-white mb-4">
      <h1 class="mb-2"><i class="bi bi-download me-2"></i>Export planning</h1>
      <p class="mb-0 opacity-75">Exporter une semaine (CSV / JSON) ou un pack complet</p>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <label class="form-label">Semaine</label>
        <input id="weekInput" type="number" class="form-control" value="16" min="1" max="53">
      </div>
      <div class="col-md-3">
        <label class="form-label">Année</label>
        <input id="yearInput" type="number" class="form-control" value="2026" min="2020" max="2100">
      </div>
      <div class="col-12 d-flex flex-wrap align-items-end gap-2">
        <button id="btnExportWeekCSV" class="btn btn-outline-secondary">
          <i class="bi bi-filetype-csv me-1"></i>Exporter semaine CSV
        </button>
        <button id="btnExportWeekJSON" class="btn btn-outline-secondary">
          <i class="bi bi-filetype-json me-1"></i>Exporter semaine JSON
        </button>
        <button id="btnExportAllPack" class="btn btn-primary">
          <i class="bi bi-box-arrow-down me-1"></i>Exporter pack complet
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header d-flex align-items-center justify-content-between">
        <span>Semaines en base</span>
        <button id="btnListKeys" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-clockwise me-1"></i>Actualiser
        </button>
      </div>
      <div class="card-body">
        <pre id="diagOut" class="plan-diag-pre mb-0"></pre>
      </div>
    </div>

  </div>

      </main>
    </div><!-- /wrapper_content -->

    <footer class="mt-auto py-3 border-top text-center text-muted bg-white d-print-none">
    <small>&copy; 2026 <span class="app-nom"></span></small>
  </footer>

  </div><!-- /wrapper -->

<!-- TOAST -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi bi-info-circle me-2"></i>
      <strong class="me-auto">Export</strong>
      <small class="text-muted">info</small>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fermer"></button>
    </div>
    <div class="toast-body">—</div>
  </div>
</div>

<!-- CHAÎNE JS — ORDRE STRICT CDS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-ui.js"></script>
<script src="../../js/bdb-invite-guard.js"></script>
<script src="../../js/bdb-shell.js"></script>

<script src="planning-core.js"></script>
<script src="planning-schema.js"></script>
<script src="planning-engine.js"></script>
<script src="planning-export.js"></script>
<script src="export-controller.js"></script>

</body>
</html>
