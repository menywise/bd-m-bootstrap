<!DOCTYPE html>
<!-- DBM | Surface: MODULE | Auth: bdb-shell.js | Shell: oui | Theme: DBM -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="../../js/bdb-pwa.js"></script>
  <title>Documents — Des Blocs &amp; Moi</title>

  <!-- BLOC E CSS : Bootstrap + DBM theme (pas theme-base, pas cds-overrides) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/dbm-theme.css" rel="stylesheet"/>
  <link href="../../css/bdb-ui-kit.css" rel="stylesheet"/>
  <link href="../../css/dbm-module-color.css" rel="stylesheet"/>

  <!-- CONV-MODAL-08 : cascade variables couleur module sur :root -->
  <style>
    :root {
      --module-color: #c4b5fd;
      --module-color-strong: #a78bfa;
      --module-color-text: #4c1d95;
      --module-color-soft: rgba(196, 181, 253, 0.15);
    }
  </style>
</head>

<body class="sidebar-closed">

  <div id="wrapper">

    <!-- INTERDIT-E1 : #bdb-shell premier enfant de #wrapper -->
    <div id="bdb-shell"
         data-module-title="Documents"
         data-module-icon="bi-folder2-open"
         data-root-path="../../"
         data-login-mode="modal"
         data-shell-theme="dbm">
    </div>

    <div id="wrapper_content">
      <div class="app-layout">
        <main class="app-main" id="main-content">
          <div class="app-content" data-module-color="savoir" style="--module-color:#c4b5fd;--module-color-strong:#a78bfa;--module-color-text:#1e1b4b;--module-color-soft:rgba(196,181,253,0.15)">

            <!-- Breadcrumb -->


            <section class="app-zone" data-zone="Breadcrumb">
              <nav class="app-breadcrumb" aria-label="Fil d'Ariane">
              <a href="../../index.html">Accueil</a>
              <span class="app-breadcrumb-sep"><i class="bi bi-chevron-right"></i></span>
              <span>Documents</span>
            </nav>


            </section>

                        <section class="app-zone" data-zone="Page Title">


                          <!-- Bandeau colore module —  couleur = group_color -->
            <div class="p-4 rounded shadow-sm mb-4"
                 style="background:linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%);color:#1e1b4b">
              <h1 class="mb-2 fw-bold"><i class="bi bi-folder2-open me-2"></i>Documents</h1>
              <p style="opacity:0.75" class="mb-0">Documents partagés de l'équipe</p>
            </div>


                        </section>
            <section class="app-zone" data-zone="Content">
              <!-- Content (placeholder : module en preparation) -->
              <div class="app-card" data-accent="module">
              <div class="app-empty" style="padding:4rem 1rem">
                <i class="bi bi-folder2-open" style="font-size:3rem;color:var(--app-text-muted)"></i>
                <p style="font-size:1rem;font-weight:500;margin:1rem 0 .5rem">Module en preparation</p>
                <p style="font-size:.85rem;color:var(--app-text-muted);max-width:480px;margin:0 auto">
                  Ce module accueillera les documents partages de l'equipe. Chaque chose en son temps.
                </p>
              </div>
              </div>

            </section>
          </div><!-- /app-content -->

          <footer class="app-footer">
            <small>&copy; 2026 <span class="app-nom"></span></small>
          </footer>

        </main>
      </div><!-- /app-layout -->
    </div><!-- /wrapper_content -->

  </div><!-- /wrapper -->

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/bdb-ui.js"></script>
  <script src="../../js/bdb-invite-guard.js"></script>
  <script src="../../js/bdb-shell.js"></script>
  <script src="../../js/bdb-demo.js"></script>
  <script src="ged-app.js"></script>

</body>
</html>
