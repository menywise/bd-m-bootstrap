<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cours | BDB</title>

  <!-- ── CHAÎNE CSS — ordre immuable (CHANTIER BLOC E) ── -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <!-- Quill CSS — exception documentée RÈGLE-COURS-02 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet"/>
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <link href="cours-ui.css" rel="stylesheet"/>
</head>
<body class="d-flex min-vh-100">

<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- SHELL BDB — premier enfant de <main> (INTERDIT-E1)
       V1 corrigé : offcanvas + header hardcodés supprimés.
       bdb-shell.js v1.4.0 injecte navigation, header, window.bdbUser. -->
  <div id="bdb-shell"
       data-module-title="Cours"
       data-module-icon="bi-mortarboard">
  </div>

  <!-- Bannière hors-service — dans le DOM, affichée via .show (V1 anti-pattern corrigé) -->
  <div id="offlineBanner" class="cds-offline-banner">
    <i class="bi bi-wifi-off me-2"></i>
    Connexion Supabase indisponible — les données ne peuvent pas être chargées.
  </div>

  <div class="container-fluid p-4 bg-light flex-grow-1">

    <!-- Toolbar filtres + slot admin (V2 corrigé — pattern C.6, INTERDIT-C4) -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="cSearch" placeholder="Titre, résumé..."/>
            </div>
          </div>
          <div class="col-6 col-md-2">
            <select class="form-select" id="cNiveau">
              <option value="">Tous niveaux</option>
              <option value="debutant">Débutant</option>
              <option value="intermediaire">Intermédiaire</option>
              <option value="avance">Avancé</option>
            </select>
          </div>
          <!-- Filtre statut — masqué par défaut, visible admin uniquement (BLOC 3) -->
          <div class="col-6 col-md-2 d-none" id="cStatusWrapper">
            <select class="form-select" id="cStatus">
              <option value="">Tous statuts</option>
              <option value="draft">Brouillon</option>
              <option value="published">Publié</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select" id="cCategory"><option value="">Toutes catégories</option></select>
          </div>
          <!-- Slot admin — présent dans le DOM, masqué par défaut, révélé si isAdmin -->
          <div class="col-6 col-md-auto d-none" id="adminActions">
            <button class="btn btn-warning text-white w-100" id="btnNew">
              <i class="bi bi-plus-lg me-1"></i>Nouveau cours
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Grille -->
    <div id="coursGrid" class="row g-3"></div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 Bible de Bloc — CDS Compliant</small>
  </footer>
</main>

<!-- ===================== MODAL FORM ===================== -->
<div class="modal fade" id="modalCours" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCoursLabel">Nouveau cours</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="cFormError" class="alert alert-danger d-none"></div>
        <div class="row g-3">

          <div class="col-12">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="cTitre" placeholder="Titre du cours"/>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Résumé</label>
            <input type="text" class="form-control" id="cDesc" placeholder="Résumé en une ligne"/>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Images <span class="text-muted fw-normal">(max 3)</span></label>
            <div id="cImageUploadZone" class="cours-upload-zone">
              <i class="bi bi-image fs-2 text-muted d-block mb-2"></i>
              <p class="text-muted mb-1">Glissez des images ou <strong>cliquez pour parcourir</strong></p>
              <small class="text-muted">JPG, PNG, WebP — max 5 Mo</small>
              <input type="file" id="cFileInput" accept="image/*" multiple class="d-none"/>
            </div>
            <div id="cImagePreviews" class="d-flex flex-wrap gap-2 mt-2"></div>
          </div>

          <div class="col-12 col-sm-4">
            <label class="form-label fw-semibold">Niveau</label>
            <select class="form-select" id="cFormNiveau">
              <option value="debutant">Débutant</option>
              <option value="intermediaire">Intermédiaire</option>
              <option value="avance">Avancé</option>
            </select>
          </div>
          <div class="col-12 col-sm-4">
            <label class="form-label fw-semibold">Catégorie</label>
            <select class="form-select" id="cFormCategory"><option value="">— Choisir —</option></select>
          </div>
          <div class="col-12 col-sm-4">
            <label class="form-label fw-semibold">Statut</label>
            <select class="form-select" id="cFormStatus">
              <option value="draft">Brouillon</option>
              <option value="published">Publié</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Contenu du cours</label>
            <div id="cQuill" class="cours-quill-editor"></div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Tags <span class="text-muted fw-normal">(fonction, acronyme, libre — max 5)</span></label>
            <input type="text" class="form-control mb-2" id="cTagSearch" placeholder="Rechercher un tag..."/>
            <div id="cTagResults" class="d-flex flex-wrap gap-1 mb-2"></div>
            <div id="cSelectedTags" class="d-flex flex-wrap gap-1"><span class="text-muted small">Aucun tag</span></div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-warning text-white" id="cBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MODAL VIEW ===================== -->
<div class="modal fade" id="modalCoursView" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalViewLabel"><i class="bi bi-mortarboard me-2 text-warning"></i>Cours</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <!-- V6 corrigé : spinner-border → skeleton dans le DOM initial -->
      <div class="modal-body" id="modalViewBody">
        <div class="placeholder-glow">
          <span class="placeholder col-4 mb-2 rounded d-block"></span>
          <span class="placeholder col-8 mb-3 rounded d-block"></span>
          <span class="placeholder col-12 mb-1 rounded d-block"></span>
          <span class="placeholder col-10 rounded d-block"></span>
        </div>
      </div>
      <div class="modal-footer" id="modalViewFooter"></div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="modal fade" id="modalLightbox" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-header border-0">
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center p-2">
        <img id="lightboxImg" src="" alt="" class="img-fluid rounded cds-lightbox-img-80"/>
      </div>
    </div>
  </div>
</div>

<!-- Modale confirmation suppression (confirm() natif remplacé) -->
<div class="modal fade" id="modalCoursConfirm" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Supprimer ?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body small text-muted" id="coursConfirmMsg">Cette action est irréversible.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-danger btn-sm" id="btnCoursConfirmDel">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi me-2" id="toastIcon"></i>
      <strong class="me-auto" id="toastTitle">Info</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMsg">—</div>
  </div>
</div>

<!-- ── CHAÎNE JS — ordre immuable (CHANTIER BLOC E)
     V4 corrigé : Bootstrap JS AVANT Supabase SDK
     V5 corrigé : bdb-shell.js ajouté ── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<!-- DOMPurify — sanitisation HTML Quill côté lecture (R4-XSS-01) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-shell.js"></script>

<script src="cours-app.js"></script>
</body>
</html>
