<!DOCTYPE html>
<!-- DBM | Surface: MODULE | Auth: bdb-shell.js | Shell: oui -->
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cours topo — Vue détail — DBM</title>

  <!-- BLOC E CSS — Chaîne V5.1 (CONV-CHAIN-E) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/dbm-theme.css" rel="stylesheet"/>
  <link href="../../css/bdb-ui-kit.css" rel="stylesheet"/>
  <link href="../../css/dbm-module-color.css" rel="stylesheet"/>
  <link href="cours-ui.css" rel="stylesheet"/>

  <!-- Variables couleur module (CONV-MODULE-COLOR-02) -->
  <style>
    :root {
      --module-color: #c4b5fd;
      --module-color-strong: #a78bfa;
      --module-color-text: #1e1b4b;
      --module-color-soft: rgba(196,181,253,0.15);
    }
  </style>
</head>

<body>

  <div id="wrapper" class="d-flex align-items-stretch flex-column min-vh-100">

    <!-- INTERDIT-E1 : #bdb-shell premier enfant de #wrapper -->
    <div id="bdb-shell"
         data-module-title="Cours"
         data-module-icon="bi-mortarboard"
         data-root-path="../../"
         data-shell-kind="backoffice"
         data-login-mode="modal"
         data-shell-theme="dbm">
    </div>

    <div id="wrapper_content" class="d-flex flex-fill">
      <main id="middle" class="flex-fill">
        <div class="container-fluid p-3 p-md-4" id="viewContainer">

          <!-- État loading -->
          <div id="stateLoading">
            <div class="placeholder-glow mb-3">
              <span class="placeholder col-3 rounded mb-2 d-block cours-skel-1"></span>
              <span class="placeholder col-7 rounded d-block cours-skel-2"></span>
            </div>
            <div class="placeholder-glow">
              <span class="placeholder col-12 rounded mb-2 d-block cours-skel-5"></span>
              <span class="placeholder col-12 rounded mb-2 d-block cours-skel-8"></span>
              <span class="placeholder col-12 rounded d-block cours-skel-5"></span>
            </div>
          </div>

          <!-- État error -->
          <div id="stateError" class="d-none">
            <div class="alert alert-danger d-flex align-items-center gap-2">
              <i class="bi bi-x-circle-fill"></i>
              <span id="stateErrorMsg">Cours introuvable.</span>
            </div>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-left me-1"></i>Retour à la liste
            </a>
          </div>

          <!-- Contenu -->
          <div id="stateContent" class="d-none">

            <!-- En-tête cours -->
            <div class="mb-4">
              <nav aria-label="breadcrumb" class="mb-2">
                <ol class="breadcrumb mb-0 small">
                  <li class="breadcrumb-item"><a href="index.html">Cours</a></li>
                  <li class="breadcrumb-item active" id="vBreadcrumb">Topographie</li>
                </ol>
              </nav>
              <h1 class="h3 mb-2" id="vTitre"></h1>
              <div class="d-flex flex-wrap align-items-center gap-2 mb-2" id="vBadges"></div>
              <p class="text-muted mb-0" id="vDesc"></p>
            </div>

            <!-- Blocs -->
            <div id="vBlocs" class="d-flex flex-column gap-3"></div>

            <!-- Footer admin -->
            <div class="d-none mt-4 pt-3 border-top" id="vAdminFooter">
              <a id="vEditLink" href="#" class="btn btn-module btn-sm">
                <i class="bi bi-pencil me-1"></i>Modifier ce cours
              </a>
              <a href="index.html" class="btn btn-outline-secondary btn-sm ms-2">
                <i class="bi bi-arrow-left me-1"></i>Liste
              </a>
            </div>

          </div>

        </div>
      </main>
    </div>

    <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
      <small>&copy; 2026 <span class="app-nom"></span> — CDS Compliant</small>
    </footer>

  </div>

  <!-- SCRIPTS — Chaîne V5.1 (CONV-CHAIN-JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/bdb-modal-a11y.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/bdb-ui.js"></script>
  <script src="../../js/bdb-invite-guard.js"></script>
  <script src="../../js/bdb-shell.js"></script>
  <script src="view-app.js"></script>
  <!-- PWA en fin de chaîne (CONV-CHAIN-E V5) -->
  <script src="../../js/bdb-pwa.js"></script>

</body>
</html>
