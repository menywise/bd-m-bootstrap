<!DOCTYPE html>
<!-- BDB | Surface: MODULE | Auth: bdb-shell.js | Shell: oui -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="../../js/bdb-pwa.js"></script>
  <title>[Nom Module]</title>

  <!-- 1. Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- 2. Smarty V5 core (composants + layout) -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@63905396c73b061f336f8f5178d738627bca601c/theme-base.css" rel="stylesheet"/>
  <!-- 2. Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- 3. CDS overrides globaux -->
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <!-- 4. CSS module — scopé #[module]App -->
  <link href="[module]-ui.css" rel="stylesheet"/>
</head>

<!--
  BODY — pas de classe layout-admin
  BDB app membre : shell injecte header + offcanvas
-->
<body>

  <div id="wrapper" class="d-flex align-items-stretch flex-column min-vh-100">

    <!-- SHELL BDB — premier enfant de wrapper (INTERDIT-E1) -->
    <!-- Injecte : header #header + offcanvas navigation -->
    <!-- Signaux : isAdmin → badge bleu · isCreator → badge violet · isDemo → bandeau jaune -->
    <div id="bdb-shell"
         data-module-title="[Nom Module]"
         data-module-icon="bi-[icon]"
         data-root-path="../../"
         data-shell-kind="backoffice"
         data-login-mode="modal">
    </div>

    <!-- CONTENU MODULE -->
    <div id="wrapper_content" class="d-flex flex-fill">

      <!-- Lors de la copie : renommer id="middle" en id="[module]App" si scoping CSS souhaité -->
      <main id="middle" class="flex-fill">
        <div class="container-fluid p-3 p-md-4">

          <!-- ═══════════════════════════════════════════════
               TOOLBAR — visible par tous les isMember
               ═══════════════════════════════════════════ -->
          <div class="card border mb-4">
            <div class="card-body py-2 px-3">
              <div class="row g-2 align-items-center">

                <!-- Filtres / recherche -->
                <div class="col-12 col-md">
                  <!-- ex: <input type="search" class="form-control form-control-sm" placeholder="Rechercher…"/> -->
                </div>

                <!-- SLOT ADMIN — masqué par défaut, affiché si isAdmin -->
                <div class="col-12 col-md-auto ms-md-auto d-none" id="[module]AdminSlot">
                  <button class="btn btn-primary btn-sm w-100" id="btnNew" type="button">
                    <i class="bi bi-plus-lg me-1"></i>Ajouter
                  </button>
                </div>

              </div>
            </div>
          </div>

          <!-- ═══════════════════════════════════════════════
               3 ÉTATS UI (Standard C.9)
               ═══════════════════════════════════════════ -->

          <!-- Loading -->
          <div id="[module]Loading">
            <div class="card border">
              <div class="card-body p-3">
                <div class="placeholder-glow d-flex flex-column gap-2">
                  <span class="placeholder col-12 rounded"></span>
                  <span class="placeholder col-10 rounded"></span>
                  <span class="placeholder col-11 rounded"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Empty -->
          <div id="[module]Empty" class="d-none">
            <div class="text-center py-5 text-muted">
              <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
              <p class="mb-1 fw-semibold">Aucun élément trouvé</p>
              <p class="small">Le contenu apparaîtra ici.</p>
            </div>
          </div>

          <!-- Error -->
          <div id="[module]Error" class="d-none">
            <div class="alert alert-danger d-flex gap-2 align-items-center">
              <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
              <div>
                <span id="[module]ErrorMsg">Impossible de charger les données.</span>
                <button class="btn btn-sm btn-outline-danger ms-2"
                        id="btnRetry" type="button">Réessayer</button>
              </div>
            </div>
          </div>

          <!-- Contenu -->
          <div id="[module]Grid" class="d-none">
            <!-- Liste, tableau ou cartes -->
          </div>

          <!-- ═══════════════════════════════════════════════
               SECTION ADMIN — masquée par défaut
               Visible si isAdmin · Pattern CONV-ADMIN-MODULE-01
               ═══════════════════════════════════════════ -->
          <div id="[module]AdminSection" class="d-none mt-5">

            <div class="border-top pt-4 mb-4">
              <span class="badge bg-primary">Administration</span>
            </div>

            <!-- Dashboard admin -->
            <div class="row g-3 mb-4">
              <div class="col-6 col-md-3">
                <div class="card border text-center p-3">
                  <div class="fs-3 fw-bold" id="kpi1">—</div>
                  <div class="text-muted small">[KPI label]</div>
                </div>
              </div>
            </div>

            <!-- CRUD admin -->
            <div class="card border">
              <div class="card-body">
                <!-- Tableau CRUD -->
              </div>
            </div>

          </div><!-- /AdminSection -->

        </div><!-- /container-fluid -->
      </main>

    </div><!-- /wrapper_content -->

    <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
      <small>&copy; 2026 <span class="app-nom"><!-- injecté par bdb-shell --></span> —
      <span class="badge bg-light text-dark border">CDS Compliant</span></small>
    </footer>

  </div><!-- /wrapper -->

  <!-- ═══════════════════════════════════════════════
       MODALES (si nécessaire)
       ═══════════════════════════════════════════ -->
  <!-- <div class="modal fade" id="modal[Module]" tabindex="-1"> ... </div> -->

  <!-- TOASTS -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <i class="bi me-2" id="toastIcon"></i>
        <strong class="me-auto" id="toastTitle">Info</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMsg">—</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       CHAÎNE JS — ordre strict (BLOC E)
       ═══════════════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/bdb-modal-a11y.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/bdb-ui.js"></script>
  <script src="../../js/bdb-invite-guard.js"></script>
  <script src="../../js/bdb-shell.js"></script>
  <!-- <script src="../../js/bdb-crud-helpers.js"></script> si nécessaire -->
  <script src="[module]-app.js"></script>

</body>
</html>

<!--
=================================================================
  NOTES — [module]-app.js
=================================================================

document.addEventListener('DOMContentLoaded', async () => {
  await window.bdbShellReady;

  // isAdmin → slot + section admin
  if (window.bdbUser.isAdmin) {
    document.getElementById('[module]AdminSlot')?.classList.remove('d-none');
    document.getElementById('[module]AdminSection')?.classList.remove('d-none');
    initAdmin();
  }

  await loadData();
});

    modules/[x]/     → "../../"
