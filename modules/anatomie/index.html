<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anatomie | BDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <link href="anatomie-ui.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet"/>
</head>
<body class="d-flex min-vh-100">


<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- SHELL : premier enfant de <main> — INTERDIT-E1 -->
  <div id="bdb-shell"
       data-module-title="Anatomie"
       data-module-icon="bi-activity">
  </div>

  <div class="container-fluid p-4 bg-light flex-grow-1">

    <!-- Toolbar : filtres + action admin -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="aSearch" placeholder="Titre, description..."/>
            </div>
          </div>
          <div class="col-6 col-md-auto">
            <select class="form-select" id="aRegion">
              <option value="">Toutes régions</option>
              <option>Tête et cou</option>
              <option>Thorax</option>
              <option>Abdomen</option>
              <option>Bassin</option>
              <option>Membre supérieur</option>
              <option>Membre inférieur</option>
              <option>Rachis</option>
              <option>Autre</option>
            </select>
          </div>
          <div class="col-6 col-md-auto">
            <select class="form-select" id="aCategory"><option value="">Toutes catégories</option></select>
          </div>
          <!-- Bouton admin — masqué par défaut, affiché par initFromShell() -->
          <div class="col-12 col-md-auto d-none" id="aToolbarAdminSlot">
            <button class="btn btn-danger w-100" id="btnNew">
              <i class="bi bi-plus-lg me-1"></i>Nouvelle fiche
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Grille -->
    <div id="anatomieGrid" class="row g-3"></div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 Bible de Bloc — CDS Compliant</small>
  </footer>
</main>

<!-- ===================== MODAL FORM ===================== -->
<div class="modal fade" id="modalAnat" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalAnatLabel">Nouvelle fiche anatomie</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="aFormError" class="alert alert-danger d-none"></div>
        <div class="row g-3">

          <!-- Titre -->
          <div class="col-12">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="aTitre" placeholder="Ex: Anatomie du genou"/>
          </div>

          <!-- Description courte -->
          <div class="col-12">
            <label class="form-label fw-semibold">Description courte</label>
            <input type="text" class="form-control" id="aDesc" placeholder="Résumé en une ligne"/>
          </div>

          <!-- Images -->
          <div class="col-12">
            <label class="form-label fw-semibold">Images / Schémas <span class="text-muted fw-normal">(max 3)</span></label>
            <div id="aImageUploadZone" class="anat-upload-zone">
              <i class="bi bi-image fs-2 text-muted d-block mb-2"></i>
              <p class="text-muted mb-1">Glissez des images ou <strong>cliquez pour parcourir</strong></p>
              <small class="text-muted">JPG, PNG, WebP — max 5 Mo</small>
              <input type="file" id="aFileInput" accept="image/*" multiple class="d-none"/>
            </div>
            <div id="aImagePreviews" class="d-flex flex-wrap gap-2 mt-2"></div>
          </div>

          <!-- Région + Catégorie -->
          <div class="col-12 col-sm-6">
            <label class="form-label fw-semibold">Région anatomique</label>
            <select class="form-select" id="aFormRegion">
              <option value="">— Choisir —</option>
              <option>Tête et cou</option>
              <option>Thorax</option>
              <option>Abdomen</option>
              <option>Bassin</option>
              <option>Membre supérieur</option>
              <option>Membre inférieur</option>
              <option>Rachis</option>
              <option>Autre</option>
            </select>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label fw-semibold">Catégorie</label>
            <select class="form-select" id="aFormCategory"><option value="">— Choisir —</option></select>
          </div>

          <!-- Contenu Quill -->
          <div class="col-12">
            <label class="form-label fw-semibold">Contenu détaillé</label>
            <div id="aQuill" class="anat-quill-editor"></div>
          </div>

          <!-- Tags -->
          <div class="col-12">
            <label class="form-label fw-semibold">Tags <span class="text-muted fw-normal">(anatomie, acronyme, libre — max 5)</span></label>
            <input type="text" class="form-control mb-2" id="aTagSearch" placeholder="Rechercher un tag..."/>
            <div id="aTagResults" class="d-flex flex-wrap gap-1 mb-2"></div>
            <div id="aSelectedTags" class="d-flex flex-wrap gap-1"><span class="text-muted small">Aucun tag</span></div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-danger" id="aBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MODAL VIEW ===================== -->
<div class="modal fade" id="modalAnatView" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalViewLabel"><i class="bi bi-diagram-3 me-2 text-danger"></i>Fiche anatomie</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalViewBody">
        <div class="text-center py-5"><div class="spinner-border text-danger"></div></div>
      </div>
      <div class="modal-footer" id="modalViewFooter"></div>
    </div>
  </div>
</div>

<!-- Modale confirmation suppression -->
<div class="modal fade" id="modalConfirmAnat" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Supprimer ?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body small text-muted" id="confirmAnatMsg">Cette action est irréversible.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-danger btn-sm" id="btnConfirmAnat">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="modal fade" id="modalLightbox" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-header border-0">
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center p-2">
        <img id="lightboxImg" src="" alt="" class="img-fluid rounded cds-lightbox-img-80"/>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi me-2" id="toastIcon"></i>
      <strong class="me-auto" id="toastTitle">Info</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMsg">—</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-shell.js"></script>

<script src="anatomie-app.js"></script>
</body>
</html>
