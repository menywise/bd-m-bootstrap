<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Préférences chirurgien | BDB</title>
  <!-- 1. Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- 2. Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- 3. CDS tokens — remplacer @latest par tag fixe avant déploiement OVH -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <!-- 4. CDS print -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <!-- 5. Quill (éditeur rich text) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet"/>
  <!-- 6. CDS overrides globaux -->
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <!-- 7. CSS module -->
  <link href="preferences-ui.css" rel="stylesheet"/>
</head>

<body class="d-flex min-vh-100">
<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- SHELL : PREMIER ENFANT de <main> — INTERDIT-E1 -->
  <div id="bdb-shell"
       data-module-title="Préférences chirurgiens"
       data-module-icon="bi-person-gear">
  </div>

  <!-- CONTENU MODULE -->
  <div class="container-fluid p-4 bg-light flex-grow-1">

    <!-- Filtres -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-5">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="pSearch" placeholder="Titre, description..."/>
            </div>
          </div>
          <div class="col-6 col-md-2">
            <select class="form-select" id="pGlobal">
              <option value="">Toutes</option>
              <option value="true">Globale</option>
              <option value="false">Spécifique</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select" id="pChirurgien"><option value="">Tous chirurgiens</option></select>
          </div>
          <!-- Slot admin — C.6 -->
          <div class="col-12 col-md-auto d-none" id="headerAdminSlot"></div>
        </div>
      </div>
    </div>

    <!-- États C.9 — loading -->
    <div id="prefsLoading" class="d-none">
      <div class="placeholder-glow">
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <div class="d-flex align-items-start gap-3">
              <div class="placeholder rounded-circle pref-chir-avatar"></div>
              <div class="flex-grow-1">
                <div class="placeholder col-5 rounded mb-2"></div>
                <div class="placeholder col-3 rounded mb-2"></div>
                <div class="placeholder col-8 rounded"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <div class="d-flex align-items-start gap-3">
              <div class="placeholder rounded-circle pref-chir-avatar"></div>
              <div class="flex-grow-1">
                <div class="placeholder col-6 rounded mb-2"></div>
                <div class="placeholder col-4 rounded mb-2"></div>
                <div class="placeholder col-7 rounded"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex align-items-start gap-3">
              <div class="placeholder rounded-circle pref-chir-avatar"></div>
              <div class="flex-grow-1">
                <div class="placeholder col-4 rounded mb-2"></div>
                <div class="placeholder col-5 rounded mb-2"></div>
                <div class="placeholder col-6 rounded"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- États C.9 — empty -->
    <div id="prefsEmpty" class="d-none">
      <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5 text-muted">
          <i class="bi bi-person-gear fs-1 d-block mb-3"></i>
          <p class="mb-0">Aucune préférence trouvée</p>
          <button class="btn btn-outline-primary mt-3 d-none" id="btnNewEmpty">
            <i class="bi bi-plus-lg me-1"></i>Créer une préférence
          </button>
        </div>
      </div>
    </div>

    <!-- États C.9 — error -->
    <div id="prefsError" class="d-none">
      <div class="cds-error-state">
        <i class="bi bi-wifi-off cds-error-icon"></i>
        <div class="cds-error-title">Données non chargées</div>
        <div class="cds-error-msg" id="prefsErrorMsg">Impossible de contacter le serveur.</div>
        <button class="btn btn-sm btn-outline-danger cds-error-retry" id="prefsRetryBtn">
          <i class="bi bi-arrow-clockwise me-1"></i>Réessayer
        </button>
      </div>
    </div>

    <!-- Liste -->
    <div id="prefsList"></div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 Bible de Bloc — CDS Compliant</small>
  </footer>
</main>

<!-- =====================
     MODAL CREATE/EDIT
     ===================== -->
<div class="modal fade" id="modalPref" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPrefLabel">Nouvelle préférence</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="pFormError" class="alert alert-danger d-none"></div>
        <div class="row g-3">

          <!-- Chirurgien (création admin uniquement) -->
          <div class="col-12" id="pChirurgienRow">
            <label class="form-label fw-semibold">Chirurgien <span class="text-danger">*</span></label>
            <select class="form-select" id="pFormChirurgien"><option value="">— Sélectionner —</option></select>
          </div>

          <!-- Titre -->
          <div class="col-12">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="pTitre" placeholder="Ex: Installation standard arthroscopie"/>
          </div>

          <!-- Globale -->
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="pIsGlobal" role="switch" checked/>
              <label class="form-check-label fw-semibold" for="pIsGlobal">
                <i class="bi bi-globe me-1 text-primary"></i>Préférence globale (toutes interventions)
              </label>
            </div>
          </div>

          <!-- Fiche liée (si non globale) -->
          <div class="col-12 d-none" id="pFicheRow">
            <label class="form-label fw-semibold">Fiche d'intervention liée</label>
            <select class="form-select" id="pFormFiche"><option value="">— Sélectionner —</option></select>
          </div>

          <!-- Description (Quill) -->
          <div class="col-12">
            <label class="form-label fw-semibold">Description / Détails</label>
            <div id="pQuill" class="pref-quill-editor"></div>
          </div>

          <!-- Tags -->
          <div class="col-12">
            <label class="form-label fw-semibold">Tags <span class="text-muted fw-normal">(max 5)</span></label>
            <div class="d-flex gap-2 mb-2">
              <input type="text" class="form-control" id="pTagSearch" placeholder="Rechercher (personne, marque, intervention)..."/>
            </div>
            <div id="pTagResults" class="d-flex flex-wrap gap-1 mb-2"></div>
            <div id="pSelectedTags" class="d-flex flex-wrap gap-1">
              <span class="text-muted small">Aucun tag sélectionné</span>
            </div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" id="pBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- =====================
     MODAL DÉTAIL (lecture)
     ===================== -->
<div class="modal fade" id="modalPrefView" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalViewLabel">Préférence</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalViewBody">
        <div class="placeholder-glow p-3">
          <div class="placeholder col-5 rounded mb-3"></div>
          <div class="placeholder col-8 rounded mb-2"></div>
          <div class="placeholder col-6 rounded"></div>
        </div>
      </div>
      <div class="modal-footer" id="modalViewFooter"></div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi me-2" id="toastIcon"></i>
      <strong class="me-auto" id="toastTitle">Info</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMsg">—</div>
  </div>
</div>

<!-- JS — ordre immuable -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-shell.js"></script>

<script src="preferences-app.js"></script>
</body>
</html>
