<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Installation patient | BDB</title>
  <!-- 1. Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- 2. Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- 3. CDS tokens — remplacer @latest par tag fixe avant déploiement OVH -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <!-- 4. CDS print -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <!-- 5. Quill (éditeur rich text) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet"/>
  <!-- 6. CDS overrides globaux -->
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <!-- 7. CSS module -->
  <link href="installation-ui.css" rel="stylesheet"/>
</head>

<body class="d-flex min-vh-100">
<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- SHELL : PREMIER ENFANT de <main> — INTERDIT-E1 -->
  <div id="bdb-shell"
       data-module-title="Installation patient"
       data-module-icon="bi-hospital">
  </div>

  <!-- CONTENU MODULE -->
  <div class="container-fluid p-4 bg-light flex-grow-1">

    <!-- Filtres -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="iSearch" placeholder="Titre, description..."/>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select" id="iPosition">
              <option value="">Toutes positions</option>
              <option value="decubitus_dorsal">Décubitus dorsal</option>
              <option value="decubitus_ventral">Décubitus ventral</option>
              <option value="decubitus_lateral_droit">Décubitus latéral droit</option>
              <option value="decubitus_lateral_gauche">Décubitus latéral gauche</option>
              <option value="position_assise">Position assise</option>
              <option value="position_gynecologique">Position gynécologique</option>
              <option value="position_trendelenburg">Trendelenburg</option>
              <option value="position_anti_trendelenburg">Anti-Trendelenburg</option>
              <option value="position_genu_pectorale">Genu-pectorale</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select" id="iCategory"><option value="">Toutes catégories</option></select>
          </div>
          <!-- Slot admin — C.6 -->
          <div class="col-12 col-md-auto d-none" id="headerAdminSlot"></div>
        </div>
      </div>
    </div>

    <!-- États C.9 — loading -->
    <div id="gridLoading" class="d-none">
      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm"><div class="card-body placeholder-glow">
            <div class="placeholder col-4 rounded mb-2"></div>
            <div class="placeholder col-7 rounded mb-2"></div>
            <div class="placeholder col-5 rounded"></div>
          </div></div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm"><div class="card-body placeholder-glow">
            <div class="placeholder col-5 rounded mb-2"></div>
            <div class="placeholder col-6 rounded mb-2"></div>
            <div class="placeholder col-4 rounded"></div>
          </div></div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm"><div class="card-body placeholder-glow">
            <div class="placeholder col-6 rounded mb-2"></div>
            <div class="placeholder col-5 rounded mb-2"></div>
            <div class="placeholder col-7 rounded"></div>
          </div></div>
        </div>
      </div>
    </div>

    <!-- États C.9 — empty -->
    <div id="gridEmpty" class="d-none">
      <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5 text-muted">
          <i class="bi bi-hospital fs-1 d-block mb-3"></i>
          <p class="mb-0">Aucune installation trouvée</p>
          <button class="btn btn-outline-info mt-3 d-none" id="btnNewEmpty">
            <i class="bi bi-plus-lg me-1"></i>Créer une installation
          </button>
        </div>
      </div>
    </div>

    <!-- États C.9 — error -->
    <div id="gridError" class="d-none">
      <div class="cds-error-state">
        <i class="bi bi-wifi-off cds-error-icon"></i>
        <div class="cds-error-title">Données non chargées</div>
        <div class="cds-error-msg" id="gridErrorMsg">Impossible de contacter le serveur.</div>
        <button class="btn btn-sm btn-outline-danger cds-error-retry" id="gridRetryBtn">
          <i class="bi bi-arrow-clockwise me-1"></i>Réessayer
        </button>
      </div>
    </div>

    <!-- Grille -->
    <div id="installGrid" class="row g-3"></div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 Bible de Bloc — CDS Compliant</small>
  </footer>
</main>

<!-- ===================== MODAL FORM ===================== -->
<div class="modal fade" id="modalInstall" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalInstallLabel">Nouvelle installation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="iFormError" class="alert alert-danger d-none"></div>
        <div class="row g-3">

          <!-- Titre -->
          <div class="col-12">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="iTitre" placeholder="Ex: Installation pour arthroscopie genou"/>
          </div>

          <!-- Images -->
          <div class="col-12">
            <label class="form-label fw-semibold">Images / Schémas <span class="text-muted fw-normal">(max 3)</span></label>
            <div id="iImageUploadZone" class="install-upload-zone">
              <i class="bi bi-image fs-2 text-muted d-block mb-2"></i>
              <p class="text-muted mb-1">Glissez des images ou <strong>cliquez pour parcourir</strong></p>
              <small class="text-muted">JPG, PNG, WebP — max 5 Mo</small>
              <input type="file" id="iFileInput" accept="image/*" multiple class="d-none"/>
            </div>
            <div id="iImagePreviews" class="d-flex flex-wrap gap-2 mt-2"></div>
          </div>

          <!-- Position + Catégorie -->
          <div class="col-12 col-sm-6">
            <label class="form-label fw-semibold">Position du patient</label>
            <select class="form-select" id="iFormPosition">
              <option value="">— Sélectionner —</option>
              <option value="decubitus_dorsal">Décubitus dorsal</option>
              <option value="decubitus_ventral">Décubitus ventral</option>
              <option value="decubitus_lateral_droit">Décubitus latéral droit</option>
              <option value="decubitus_lateral_gauche">Décubitus latéral gauche</option>
              <option value="position_assise">Position assise</option>
              <option value="position_gynecologique">Position gynécologique</option>
              <option value="position_trendelenburg">Trendelenburg</option>
              <option value="position_anti_trendelenburg">Anti-Trendelenburg</option>
              <option value="position_genu_pectorale">Genu-pectorale</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label fw-semibold">Catégorie</label>
            <select class="form-select" id="iFormCategory"><option value="">— Choisir —</option></select>
          </div>

          <!-- Description (Quill) -->
          <div class="col-12">
            <label class="form-label fw-semibold">Description</label>
            <div id="iQuillDesc" class="inst-quill-desc"></div>
          </div>

          <!-- Précautions (Quill) -->
          <div class="col-12">
            <label class="form-label fw-semibold"><i class="bi bi-exclamation-triangle text-warning me-1"></i>Précautions</label>
            <div id="iQuillPrec" class="inst-quill-prec"></div>
          </div>

          <!-- Fiches liées -->
          <div class="col-12">
            <label class="form-label fw-semibold"><i class="bi bi-link-45deg me-1"></i>Fiches d'intervention liées</label>
            <div id="iFichesContainer" class="border rounded install-fiches-list">
              <div class="text-muted small text-center py-3">Chargement des fiches...</div>
            </div>
            <small id="iFichesCount" class="text-muted"></small>
          </div>

          <!-- Tags -->
          <div class="col-12">
            <label class="form-label fw-semibold">Tags <span class="text-muted fw-normal">(fonction, personne, libre — max 5)</span></label>
            <input type="text" class="form-control mb-2" id="iTagSearch" placeholder="Rechercher un tag..."/>
            <div id="iTagResults" class="d-flex flex-wrap gap-1 mb-2"></div>
            <div id="iSelectedTags" class="d-flex flex-wrap gap-1"><span class="text-muted small">Aucun tag</span></div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-info text-white" id="iBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MODAL VIEW ===================== -->
<div class="modal fade" id="modalInstallView" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalViewLabel"><i class="bi bi-hospital me-2 text-info"></i>Installation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalViewBody">
        <div class="placeholder-glow p-3">
          <div class="placeholder col-5 rounded mb-3"></div>
          <div class="placeholder col-8 rounded mb-2"></div>
          <div class="placeholder col-6 rounded"></div>
        </div>
      </div>
      <div class="modal-footer" id="modalViewFooter"></div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="modal fade" id="modalLightbox" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark border-0">
      <div class="modal-header border-0">
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center p-2">
        <img id="lightboxImg" src="" alt="" class="img-fluid rounded cds-lightbox-img-80"/>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi me-2" id="toastIcon"></i>
      <strong class="me-auto" id="toastTitle">Info</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMsg">—</div>
  </div>
</div>

<!-- JS — ordre immuable (BLOC E) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-shell.js"></script>

<script src="installation-app.js"></script>
</body>
</html>
