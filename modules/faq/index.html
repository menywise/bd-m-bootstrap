<!DOCTYPE html>
<!-- DBM | Surface: MODULE | Auth: bdb-shell.js | Shell: oui -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FAQ bloc opératoire — Questions soignants IBODE — DBM</title>

  <!-- BLOC E CSS — Chaîne V5.1 (CONV-CHAIN-E) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/dbm-theme.css" rel="stylesheet"/>
  <link href="../../css/bdb-ui-kit.css" rel="stylesheet"/>
  <link href="../../css/dbm-module-color.css" rel="stylesheet"/>
  <link href="faq-ui.css" rel="stylesheet"/>

  <!-- Variables couleur module (CONV-MODULE-COLOR-02) -->
  <style>
    :root {
      --module-color: #c4b5fd;
      --module-color-strong: #a78bfa;
      --module-color-text: #4c1d95;
      --module-color-soft: rgba(196, 181, 253, 0.15);
    }
  </style>
  <meta name="description" content="Questions fréquentes du bloc opératoire. Réponses validées par les pairs sur installations, matériel, gestes et procédures."/>
  <link rel="canonical" href="https://lebloc.fr/dbm/modules/faq/"/>
  <!-- Open Graph -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="FAQ du bloc opératoire"/>
  <meta property="og:description" content="Réponses validées par les pairs sur installations, matériel, gestes et procédures du bloc opératoire."/>
  <meta property="og:url" content="https://lebloc.fr/dbm/modules/faq/"/>
  <meta property="og:locale" content="fr_FR"/>
  <meta property="og:site_name" content="Des Blocs & Moi"/>
  <!-- Twitter card -->
  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="FAQ du bloc opératoire"/>
  <meta name="twitter:description" content="Réponses validées par les pairs sur installations, matériel, gestes et procédures du bloc opératoire."/>
</head>

<body class="sidebar-closed">

  <div id="wrapper">

    <!-- INTERDIT-E1 : #bdb-shell premier enfant de #wrapper -->
    <div id="bdb-shell"
         data-module-title="FAQ & Aide"
         data-module-icon="bi-question-circle"
         data-root-path="../../"
         data-login-mode="modal"
         data-shell-theme="dbm">
    </div>

    <div id="wrapper_content">
      <div class="app-layout">
        <main class="app-main" id="main-content">
          <div class="app-content" data-module-color="savoir" style="--module-color:#c4b5fd;--module-color-strong:#a78bfa;--module-color-text:#1e1b4b;--module-color-soft:rgba(196,181,253,0.15)">

            <!-- Breadcrumb -->


            <section class="app-zone" data-zone="Breadcrumb">
              <nav class="app-breadcrumb" aria-label="Fil d'Ariane">
              <a href="../../index.html">Accueil</a>
              <span class="app-breadcrumb-sep"><i class="bi bi-chevron-right"></i></span>
              <span>FAQ &amp; Aide</span>
            </nav>


            </section>

                        <section class="app-zone" data-zone="Page Title">


                          <!-- Bandeau colore module — gradient via variables module -->
            <div class="p-4 rounded shadow-sm mb-4 faq-page-banner">
              <h1 class="mb-2 fw-bold"><i class="bi bi-question-circle me-2"></i>FAQ & Aide</h1>
              <p class="mb-0 faq-page-subtitle">Questions fréquentes et aide contextuelle</p>
            </div>


                        </section>
            <section class="app-zone" data-zone="Filters">

              <!-- TOOLBAR (recherche + actions) -->
            <div class="faq-toolbar-bar">
              <div class="row g-2 align-items-center">

                <!-- Recherche -->
                <div class="col-12 col-sm">
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="search" id="faqSearch" class="form-control border-start-0" placeholder="Chercher dans la FAQ…" autocomplete="off"/>
                  </div>
                </div>

                <!-- Bouton membre — visible apres init shell. Pas de data-bs-toggle :
                     la modale est créée dynamiquement par buildModalQuestion() au click. -->
                <div class="col-12 col-sm-auto d-none" id="btnFaqAsk">
                  <button type="button" class="btn btn-module btn-sm w-100">
                    <i class="bi bi-question-lg me-1"></i>Poser une question
                  </button>
                </div>

                <!-- Slot admin — masque par defaut, active par initFromShell() si isAdmin (INTERDIT-C4) -->

              </div>
            </div>

            </section>
<section class="app-zone" data-zone="Content">

              <!-- MAIN CARD : tabs + etats + contenu -->
            <div class="app-card" data-accent="module">

              <!-- Tabs rubriques (peuples par faq-app.js) -->
              <div class="app-card-header faq-tabs-header">
                <ul class="nav bdb-tabs faq-tabs faq-hide-scrollbar" id="faqTabs" role="tablist">
                  <!-- Peuple par faq-app.js -->
                </ul>
              </div>

              <div class="app-card-body faq-tabs-body">

                <!-- Loading -->
                <div id="faqLoading">
                  <div class="placeholder-glow">
                    <div class="placeholder col-4 rounded mb-3"></div>
                    <div class="placeholder col-12 rounded mb-2"></div>
                    <div class="placeholder col-12 rounded mb-2"></div>
                    <div class="placeholder col-12 rounded mb-2"></div>
                  </div>
                </div>

                <!-- Empty -->
                <div id="faqEmpty" class="app-empty d-none">
                  <i class="bi bi-question-circle"></i>
                  <p class="faq-empty-title">Aucune question disponible pour le moment.</p>
                  <small class="faq-empty-help">Tu peux en soumettre une via le bouton "Poser une question".</small>
                </div>

                <!-- Error -->
                <div id="faqError" class="d-none">
                  <div class="alert alert-danger d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                    <div>
                      Impossible de charger la FAQ —
                      <span id="faqErrorMsg"></span>
                      <button class="btn btn-sm btn-outline-danger ms-2" id="btnFaqRetry">
                        <i class="bi bi-arrow-clockwise me-1"></i>Réessayer
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Content -->
                <div id="faqContent" class="d-none">
                  <div class="tab-content" id="faqTabContent">
                    <!-- Peuple par faq-app.js -->
                  </div>
                </div>

              </div><!-- /app-card-body -->
            </div><!-- /app-card -->

            </section>

          </div><!-- /app-content -->

          <footer class="app-footer">
            <small>&copy; 2026 <span class="app-nom"></span></small>
          </footer>

        </main>
      </div><!-- /app-layout -->
    </div><!-- /wrapper_content -->

  </div><!-- /wrapper -->

  <!-- TOAST — pattern bdbToast (bdb-ui.js) -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastMsg" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastText">Message</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fermer"></button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS — Chaîne JS V5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/bdb-modal-a11y.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/bdb-ui.js"></script>
  <script src="../../js/bdb-invite-guard.js"></script>
  <script src="../../js/bdb-shell.js"></script>
  <script src="../../js/bdb-demo.js"></script>
  <script src="faq-app.js"></script>
  <script src="../../js/bdb-pwa.js"></script>

</body>
</html>
