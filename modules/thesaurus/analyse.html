<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thésaurus Médical - Analyse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><i class="bi bi-journal-medical me-2"></i>Thésaurus Médical</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-search me-1"></i>Consultation</a></li>
                <li class="nav-item"><a class="nav-link" href="dashboards.html"><i class="bi bi-bar-chart me-1"></i>Dashboards</a></li>
                <li class="nav-item"><a class="nav-link active" href="analyse.html"><i class="bi bi-graph-up me-1"></i>Analyse</a></li>
                <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-gear me-1"></i>Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid py-4">
    
    <!-- Section 1: Courbe Pareto 80/20 -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <i class="bi bi-graph-up me-2"></i>Courbe de Pareto - Loi 80/20
        </div>
        <div class="card-body">
            <div id="pareto80Info" class="alert alert-info mb-3"></div>
            <canvas id="chartPareto80" height="100"></canvas>
        </div>
    </div>
    
    <!-- Section 2: Top 20 par spécialité -->
    <div class="row mb-4">
        <div class="col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-header bg-success text-white">Top 20 ORTHO</div>
                <div class="card-body"><canvas id="chartOrtho"></canvas></div>
            </div>
        </div>
        <div class="col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-header bg-warning text-dark">Top 20 TRAUMATO</div>
                <div class="card-body"><canvas id="chartTraumato"></canvas></div>
            </div>
        </div>
        <div class="col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-header bg-danger text-white">Top 20 SEPTIQUE</div>
                <div class="card-body"><canvas id="chartSeptique"></canvas></div>
            </div>
        </div>
    </div>
    
    <!-- Section 3: Heatmap PARETO × ZONE -->
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">
            <i class="bi bi-grid-3x3 me-2"></i>Heatmap PARETO × Zone Anatomique
        </div>
        <div class="card-body">
            <div id="heatmapContainer" class="table-responsive"></div>
        </div>
    </div>
    
    <!-- Section 4: Synthèse par zone -->
    <div class="card">
        <div class="card-header bg-secondary text-white">
            <i class="bi bi-funnel me-2"></i>Synthèse par zone anatomique
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="zoneSelect" class="form-label fw-bold">Sélectionnez une zone</label>
                <select class="form-select" id="zoneSelect">
                    <option value="">Sélectionnez une zone...</option>
                </select>
            </div>
            <div id="zoneSynthesisTable"></div>
        </div>
    </div>
</div>

<!-- MODAL FICHE DÉTAIL -->
<div class="modal fade" id="modalDetail" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Fiche protocole</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

<script>
const PB_URL = 'http://127.0.0.1:8090';
const COLLECTION = 'Protocoles';

let allData = [];

function calculatePareto(frequence) {
    const freq = frequence || 0;
    if (freq >= 1000) return { 
        niveau: 'CRITIQUE', 
        class: 'bg-danger',
        description: 'Maîtrise impérative. Formation prioritaire. Autonomie exigée.'
    };
    if (freq >= 300) return { 
        niveau: 'PRIORITAIRE', 
        class: 'bg-warning text-dark',
        description: 'Maîtrise attendue. Supervision légère acceptable.'
    };
    if (freq >= 50) return { 
        niveau: 'STANDARD', 
        class: 'bg-success',
        description: 'Connaissance requise. Accompagnement possible.'
    };
    return { 
        niveau: 'SECONDAIRE', 
        class: 'bg-secondary',
        description: 'Connaissance passive. Savoir localiser la documentation.'
    };
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function getParetoClass(pareto) {
    switch(pareto) {
        case 'CRITIQUE': return 'bg-danger';
        case 'PRIORITAIRE': return 'bg-warning text-dark';
        case 'STANDARD': return 'bg-success';
        case 'SECONDAIRE': return 'bg-secondary';
        default: return 'bg-light text-dark';
    }
}

async function fetchAllProtocoles() {
    try {
        let records = [], page = 1, hasMore = true;
        while (hasMore) {
            const response = await fetch(`${PB_URL}/api/collections/${COLLECTION}/records?page=${page}&perPage=500`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            records = records.concat(data.items);
            hasMore = data.page < data.totalPages;
            page++;
        }
        return records;
    } catch (error) {
        console.error('Erreur:', error);
        return [];
    }
}

async function fetchProtocoleById(id) {
    try {
        const response = await fetch(`${PB_URL}/api/collections/${COLLECTION}/records/${id}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } catch (error) {
        console.error('Erreur:', error);
        return null;
    }
}

async function showDetail(id) {
    const item = await fetchProtocoleById(id);
    if (!item) return;
    
    const pareto = calculatePareto(item.FREQUENCE);
    
    document.getElementById('modalTitle').textContent = item.ID_PROTOCOLE + ' - ' + item.LIBELLE_CIBLE;
    
    let ccamHtml = '-';
    if (item.CODES_CCAM) {
        const codes = item.CODES_CCAM.split(/[,;|\s]+/).filter(c => c.trim());
        ccamHtml = codes.map(code => 
            `<span class="badge bg-primary me-1 mb-1">${escapeHtml(code.trim())}</span>`
        ).join('');
    }
    
    document.getElementById('modalBody').innerHTML = `
        <div class="row g-4">
            ${item.ALERTES ? `
                <div class="col-12">
                    <div class="alert alert-warning mb-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>Alerte :</strong> ${item.ALERTES}
                    </div>
                </div>
            ` : ''}
            
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header fw-bold">Informations générales</div>
                    <div class="card-body">
                        <p><strong>Pathologie :</strong><br>${escapeHtml(item.PATHOLOGIE) || '-'}</p>
                        <p><strong>Type :</strong> <span class="badge bg-info">${escapeHtml(item.TYPE) || '-'}</span></p>
                        <p><strong>Zone anatomique :</strong> <span class="badge bg-secondary">${escapeHtml(item.ZONE_ANAT) || '-'}</span></p>
                        <p><strong>Catégorie :</strong> ${escapeHtml(item.CAT_PARENT) || '-'}</p>
                        <p class="mb-0"><strong>Proposition nouvel acte :</strong><br>${escapeHtml(item.PROPOSITION_NOUVEL_ACTE_LABEL) || '-'}</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header fw-bold">Métriques & Codes</div>
                    <div class="card-body">
                        <p><strong>Fréquence :</strong> ${item.FREQUENCE || 0}</p>
                        <p><strong>Pareto :</strong> <span class="badge ${pareto.class}">${pareto.niveau}</span><br>
                        <small class="text-muted">${pareto.description}</small></p>
                        <p><strong>Codes CCAM :</strong><br>${ccamHtml}</p>
                    </div>
                </div>
            </div>
            
            ${item.SYNONYMES_RECHERCHE ? `
                <div class="col-12">
                    <div class="card">
                        <div class="card-header fw-bold">Synonymes de recherche</div>
                        <div class="card-body">
                            ${item.SYNONYMES_RECHERCHE.split('|').map(s => `<span class="badge bg-light text-dark me-1 mb-1">${escapeHtml(s.trim())}</span>`).join('')}
                        </div>
                    </div>
                </div>
            ` : ''}
            
            ${item.DEFINITION_EXPERT ? `
                <div class="col-12">
                    <div class="card border-primary">
                        <div class="card-header fw-bold bg-primary text-white">
                            <i class="bi bi-book me-2"></i>Définition expert
                        </div>
                        <div class="card-body">
                            <div class="definition-content">${item.DEFINITION_EXPERT}</div>
                        </div>
                    </div>
                </div>
            ` : ''}
            
            ${item.LIBELLES_SOURCES_LIES ? `
                <div class="col-12">
                    <div class="card">
                        <div class="card-header fw-bold">Sources liées</div>
                        <div class="card-body">
                            <div class="small">${item.LIBELLES_SOURCES_LIES}</div>
                        </div>
                    </div>
                </div>
            ` : ''}
        </div>
    `;
    
    new bootstrap.Modal(document.getElementById('modalDetail')).show();
}

function renderParetoCurve(data) {
    const sorted = [...data].filter(p => (p.FREQUENCE || 0) > 0).sort((a,b) => (b.FREQUENCE || 0) - (a.FREQUENCE || 0));
    
    const total = sorted.reduce((sum, p) => sum + (p.FREQUENCE || 0), 0);
    let cumul = 0;
    const cumulPercent = sorted.map(p => {
        cumul += (p.FREQUENCE || 0);
        return (cumul / total) * 100;
    });
    
    const index80 = cumulPercent.findIndex(c => c >= 80);
    const nb80 = index80 + 1;
    
    document.getElementById('pareto80Info').innerHTML = 
        `<i class="bi bi-info-circle me-2"></i><strong>${nb80} protocoles</strong> représentent <strong>80% du volume total</strong> (${total} interventions/an)`;
    
    new Chart(document.getElementById('chartPareto80'), {
        type: 'bar',
        data: {
            labels: sorted.map((p, i) => `${i+1}`),
            datasets: [
                {
                    type: 'bar',
                    label: 'Fréquence',
                    data: sorted.map(p => p.FREQUENCE || 0),
                    backgroundColor: '#0d6efd',
                    yAxisID: 'y'
                },
                {
                    type: 'line',
                    label: 'Cumul %',
                    data: cumulPercent,
                    borderColor: '#dc3545',
                    borderWidth: 2,
                    fill: false,
                    yAxisID: 'y1'
                }
            ]
        },
        options: {
            scales: {
                y: { 
                    position: 'left', 
                    title: { display: true, text: 'Fréquence annuelle' },
                    beginAtZero: true
                },
                y1: { 
                    position: 'right', 
                    min: 0, 
                    max: 100, 
                    title: { display: true, text: 'Cumul %' },
                    grid: { drawOnChartArea: false }
                }
            },
            plugins: {
                annotation: {
                    annotations: {
                        line80: {
                            type: 'line',
                            yMin: 80,
                            yMax: 80,
                            yScaleID: 'y1',
                            borderColor: '#198754',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            label: { 
                                content: 'Seuil 80%', 
                                display: true,
                                position: 'end'
                            }
                        }
                    }
                },
                tooltip: {
                    callbacks: {
                        title: (ctx) => sorted[ctx[0].dataIndex].LIBELLE_CIBLE,
                        afterTitle: (ctx) => sorted[ctx[0].dataIndex].ID_PROTOCOLE
                    }
                }
            }
        }
    });
}

function getColorByType(type) {
    switch(type) {
        case 'ORTHO': return '#198754';
        case 'TRAUMATO': return '#ffc107';
        case 'SEPTIQUE': return '#dc3545';
        default: return '#6c757d';
    }
}

function renderTop20ByType(data, type, canvasId) {
    const filtered = data
        .filter(p => p.TYPE === type && (p.FREQUENCE || 0) > 0)
        .sort((a,b) => (b.FREQUENCE || 0) - (a.FREQUENCE || 0))
        .slice(0, 20);
    
    new Chart(document.getElementById(canvasId), {
        type: 'bar',
        data: {
            labels: filtered.map((p, i) => `#${i+1}`),
            datasets: [{
                label: `Fréquence ${type}`,
                data: filtered.map(p => p.FREQUENCE || 0),
                backgroundColor: getColorByType(type)
            }]
        },
        options: {
            indexAxis: 'y',
            plugins: {
                tooltip: {
                    callbacks: {
                        title: (ctx) => filtered[ctx[0].dataIndex].LIBELLE_CIBLE,
                        afterTitle: (ctx) => filtered[ctx[0].dataIndex].ZONE_ANAT || '-',
                        label: (ctx) => `Fréquence: ${ctx.raw}`
                    }
                }
            },
            scales: {
                x: { beginAtZero: true }
            }
        }
    });
}

function renderHeatmap(data) {
    const zones = [...new Set(data.map(p => p.ZONE_ANAT).filter(z => z && z !== 'EXCLUS'))].sort();
    const niveaux = ['CRITIQUE', 'PRIORITAIRE', 'STANDARD', 'SECONDAIRE'];
    
    const matrix = {};
    zones.forEach(z => {
        matrix[z] = { CRITIQUE: 0, PRIORITAIRE: 0, STANDARD: 0, SECONDAIRE: 0, total: 0 };
    });
    
    data.forEach(p => {
        if (!p.ZONE_ANAT || p.ZONE_ANAT === 'EXCLUS') return;
        const pareto = calculatePareto(p.FREQUENCE);
        matrix[p.ZONE_ANAT][pareto.niveau]++;
        matrix[p.ZONE_ANAT].total++;
    });
    
    let html = '<table class="table table-bordered table-sm"><thead class="table-dark"><tr><th>Zone anatomique</th>';
    niveaux.forEach(n => html += `<th class="text-center">${n}</th>`);
    html += '<th class="text-center">Total</th></tr></thead><tbody>';
    
    zones.forEach(z => {
        html += `<tr><td class="fw-bold">${z}</td>`;
        niveaux.forEach(n => {
            const count = matrix[z][n];
            const intensity = Math.min((count / 45) * 100, 100);
            const bg = count > 0 ? `rgba(13, 110, 253, ${intensity/100})` : '';
            const textColor = intensity > 50 ? 'text-white' : '';
            html += `<td class="text-center ${textColor}" style="background-color: ${bg}">${count || '-'}</td>`;
        });
        html += `<td class="text-center fw-bold">${matrix[z].total}</td></tr>`;
    });
    
    html += '</tbody></table>';
    document.getElementById('heatmapContainer').innerHTML = html;
}

function renderZoneSynthesis(data, selectedZone) {
    if (!selectedZone) {
        document.getElementById('zoneSynthesisTable').innerHTML = 
            '<p class="text-muted text-center py-4">Veuillez sélectionner une zone anatomique</p>';
        return;
    }
    
    const filtered = data
        .filter(p => p.ZONE_ANAT === selectedZone)
        .map(p => ({ ...p, paretoCalc: calculatePareto(p.FREQUENCE) }))
        .sort((a, b) => {
            const order = { CRITIQUE: 0, PRIORITAIRE: 1, STANDARD: 2, SECONDAIRE: 3 };
            const paretoCompare = order[a.paretoCalc.niveau] - order[b.paretoCalc.niveau];
            if (paretoCompare !== 0) return paretoCompare;
            return (b.FREQUENCE || 0) - (a.FREQUENCE || 0);
        });
    
    if (filtered.length === 0) {
        document.getElementById('zoneSynthesisTable').innerHTML = 
            '<p class="text-muted text-center py-4">Aucun protocole pour cette zone</p>';
        return;
    }
    
    let html = '<div class="table-responsive"><table class="table table-hover table-sm"><thead class="table-dark"><tr>';
    html += '<th>ID</th><th>Libellé</th><th>Type</th><th class="text-end">Fréquence</th><th>Pareto</th></tr></thead><tbody>';
    
    filtered.forEach(p => {
        html += `<tr style="cursor: pointer;" data-id="${p.id}" class="zone-row">`;
        html += `<td><code class="small">${escapeHtml(p.ID_PROTOCOLE)}</code></td>`;
        html += `<td>${escapeHtml(p.LIBELLE_CIBLE)}</td>`;
        html += `<td><span class="badge bg-info">${escapeHtml(p.TYPE) || '-'}</span></td>`;
        html += `<td class="text-end">${p.FREQUENCE || 0}</td>`;
        html += `<td><span class="badge ${p.paretoCalc.class}">${p.paretoCalc.niveau}</span></td>`;
        html += '</tr>';
    });
    
    html += '</tbody></table></div>';
    document.getElementById('zoneSynthesisTable').innerHTML = html;
    
    document.querySelectorAll('.zone-row').forEach(row => {
        row.addEventListener('click', () => showDetail(row.dataset.id));
    });
}

function populateZoneSelect(data) {
    const zones = [...new Set(data.map(p => p.ZONE_ANAT).filter(z => z && z !== 'EXCLUS'))].sort();
    
    const matrix = {};
    zones.forEach(z => matrix[z] = 0);
    data.forEach(p => {
        if (p.ZONE_ANAT && p.ZONE_ANAT !== 'EXCLUS') matrix[p.ZONE_ANAT]++;
    });
    
    const zoneMax = zones.reduce((max, z) => matrix[z] > matrix[max] ? z : max, zones[0]);
    
    const select = document.getElementById('zoneSelect');
    select.innerHTML = '<option value="">Sélectionnez une zone...</option>' + 
        zones.map(z => `<option value="${escapeHtml(z)}">${escapeHtml(z)} (${matrix[z]})</option>`).join('');
    
    select.value = zoneMax;
    renderZoneSynthesis(data, zoneMax);
}

document.addEventListener('DOMContentLoaded', async () => {
    allData = await fetchAllProtocoles();
    
    renderParetoCurve(allData);
    renderTop20ByType(allData, 'ORTHO', 'chartOrtho');
    renderTop20ByType(allData, 'TRAUMATO', 'chartTraumato');
    renderTop20ByType(allData, 'SEPTIQUE', 'chartSeptique');
    renderHeatmap(allData);
    populateZoneSelect(allData);
    
    document.getElementById('zoneSelect').addEventListener('change', (e) => {
        renderZoneSynthesis(allData, e.target.value);
    });
});
</script>

</body>
</html>
