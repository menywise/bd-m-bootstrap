<!DOCTYPE html>
<!-- BDB | Surface: MODULE | Auth: bdb-shell.js | Shell: oui -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="../../js/bdb-pwa.js"></script>
  <title>Admin BàO Dunod</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@63905396c73b061f336f8f5178d738627bca601c/theme-base.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <link href="veille-documentaire-ui.css" rel="stylesheet"/>
  <style>
    /* Variables pour un thème cohérent */
    :root {
      --bd-violet: #6f42c1;
      --bd-violet-rgb: 111, 66, 177;
      --bd-accent: #0d6efd;
      --bd-accent-rgb: 13, 110, 253;
    }
    /* Style des cartes de livres (Action 2) */
    .livre-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .livre-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
    .livre-card .cover-container {
      width: 100%;
      height: 250px; /* Hauteur fixe pour les couvertures */
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .livre-card .cover-container img {
      width: auto;
      height: auto;
      max-width: 80%;
      max-height: 90%;
      object-fit: contain;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .livre-card .cover-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #adb5bd;
    }
    .livre-card .badge-tag {
      background-color: #e9ecef;
      color: #495057;
      font-weight: 400;
    }
    /* Style des badges d'état (Action 3) */
    .badge-etat-workflow {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.3em 0.6em;
      border-radius: 0.3rem;
    }
    .badge-etat-workflow.a_acheter { background-color: #fff3cd; color: #664d03; }
    .badge-etat-workflow.commande { background-color: #cff4fc; color: #055160; }
    .badge-etat-workflow.recu { background-color: #e2d9f3; color: #432874; }
    .badge-etat-workflow.lu { background-color: #d1e7dd; color: #0f5132; }
    .badge-etat-workflow.indexe { background-color: #212529; color: #f8f9fa; }

    /* Style pour le surlignage de la recherche full-text (Action 4) */
    .search-highlight {
      background-color: yellow;
      padding: 0 0.1em;
      border-radius: 0.2em;
    }
    .sommaire-extrait {
      font-size: 0.8rem;
      max-height: 4.5em;
      overflow: hidden;
      position: relative;
      color: #6c757d;
    }
    .sommaire-extrait::after {
      content: '...';
      position: absolute;
      bottom: 0;
      right: 0;
      background: linear-gradient(to right, transparent, white 50%);
      padding-left: 1rem;
    }
    /* Styles du Dashboard (Action 5) */
    .dashboard-stat-icon {
      font-size: 2rem;
    }
  </style>
</head>

<body>

  <div id="wrapper" class="d-flex align-items-stretch flex-column min-vh-100">

    <div id="bdb-shell"
         data-module-title="Admin BàO Dunod"
         data-module-icon="bi-book"
         data-shell-kind="backoffice"
         data-login-mode="modal"
         data-root-path="../../">
    </div>

    <div id="wrapper_content" class="d-flex flex-fill">
      <main id="middle" class="flex-fill">

        <!-- Barre contexte -->
        <div class="border-bottom bg-white px-3 py-2">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0 small">
              <li class="breadcrumb-item">
                <a href="../admin/index.html" class="text-decoration-none">
                  <i class="bi bi-speedometer2 me-1"></i>Administration
                </a>
              </li>
              <li class="breadcrumb-item">
                <a href="index.html" class="text-decoration-none">Veille documentaire</a>
              </li>
              <li class="breadcrumb-item active">BàO Dunod</li>
            </ol>
          </nav>
        </div>

        <!-- Onglets admin Premium -->
        <ul class="nav nav-tabs px-3 pt-2" id="adminTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-livres-btn" data-bs-toggle="tab"
                    data-bs-target="#tab-livres" type="button" role="tab">
              <i class="bi bi-collection me-1"></i>Ma Bibliothèque <span id="badgeLivres" class="badge bg-secondary-subtle text-secondary-emphasis ms-1">—</span>
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-auteurs-btn" data-bs-toggle="tab"
                    data-bs-target="#tab-auteurs" type="button" role="tab">
              <i class="bi bi-people me-1"></i>Auteurs <span id="badgeAuteurs" class="badge bg-secondary-subtle text-secondary-emphasis ms-1">—</span>
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-dash-btn" data-bs-toggle="tab"
                    data-bs-target="#tab-dash" type="button" role="tab">
              <i class="bi bi-graph-up-arrow me-1"></i>Tableau de bord du Collectionneur
            </button>
          </li>
        </ul>

        <div class="tab-content px-3 pt-3 pb-4">

          <!-- ═══════════ Onglet LIVRES (Vue Premium) ═══════════ -->
          <div class="tab-pane fade show active" id="tab-livres" role="tabpanel">

            <!-- Toolbar Premium -->
            <div class="d-flex flex-wrap gap-2 mb-3 align-items-center bg-light p-3 rounded border">
              <div class="input-group vd-search-box me-2 flex-grow-1">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="search" id="searchLivres" class="form-control" placeholder="Rechercher un livre ou un outil dans les sommaires…"/>
              </div>
              <select id="filterRubrique" class="form-select vd-filter-select me-2 w-auto">
                <option value="">Toutes rubriques</option>
              </select>
              <select id="filterEtat" class="form-select vd-filter-select me-2 w-auto">
                <option value="">Tous états</option>
                <option value="a_acheter">📚 À acheter</option>
                <option value="commande">📦 Commandé</option>
                <option value="recu">📖 Reçu</option>
                <option value="lu">✅ Lu</option>
                <option value="indexe">⭐ Indexé</option>
              </select>
              <div class="ms-auto d-flex gap-2">
                <button id="btnExportLivres" class="btn btn-outline-secondary" type="button">
                  <i class="bi bi-download me-1"></i>CSV
                </button>
                <button id="btnAddLivre" class="btn btn-primary" type="button">
                  <i class="bi bi-plus-lg me-1"></i>Ajouter un livre
                </button>
              </div>
            </div>

            <!-- États : Loading, Empty, Error, List (en cartes) -->
            <div id="livresLoading">
              <div class="placeholder-glow p-3">
                <div class="placeholder col-8 rounded mb-3"></div>
                <div class="placeholder col-6 rounded mb-2"></div>
                <div class="placeholder col-7 rounded mb-2"></div>
              </div>
            </div>
            <div id="livresEmpty" class="d-none text-center py-5 text-muted">
              <i class="bi bi-book fs-1 d-block mb-2"></i>
              <p>Aucun livre dans le catalogue pour le moment.</p>
            </div>
            <div id="livresError" class="d-none"></div>
            <div id="livresList" class="d-none">
              <div id="livresGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
                <!-- Les cartes de livres seront générées ici par JS -->
              </div>
            </div>
          </div>

          <!-- ═══════════ Onglet AUTEURS ═══════════ -->
          <div class="tab-pane fade" id="tab-auteurs" role="tabpanel">

            <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
              <div class="input-group vd-search-box">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" id="searchAuteurs" class="form-control" placeholder="Rechercher un auteur…"/>
              </div>
              <div class="ms-auto">
                <button id="btnAddAuteur" class="btn btn-primary" type="button">
                  <i class="bi bi-plus-lg me-1"></i>Ajouter un auteur
                </button>
              </div>
            </div>

            <div id="auteursLoading">
              <div class="placeholder-glow p-3">
                <div class="placeholder col-6 rounded mb-2"></div>
                <div class="placeholder col-4 rounded mb-2"></div>
              </div>
            </div>
            <div id="auteursEmpty" class="d-none text-center py-5 text-muted">
              <i class="bi bi-people fs-1 d-block mb-2"></i>
              <p>Aucun auteur enregistré.</p>
            </div>
            <div id="auteursError" class="d-none"></div>
            <div id="auteursList" class="d-none">
              <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Nom</th>
                      <th class="text-end">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="auteursBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ═══════════ Onglet DASHBOARD Premium ═══════════ -->
          <div class="tab-pane fade" id="tab-dash" role="tabpanel">
            <div id="dashLoading" class="placeholder-glow p-3">
              <div class="placeholder col-4 rounded mb-2"></div>
              <div class="placeholder col-3 rounded"></div>
            </div>
            <div id="dashContent" class="d-none"></div>
          </div>

        </div>

      </main>
    </div>

    <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
      <small>&copy; 2026 <span class="app-nom"></span></small>
    </footer>

  </div>

  <!-- ═══════════ MODAL LIVRE (à adapter si besoin) ═══════════ -->
  <div class="modal fade" id="modalLivre" tabindex="-1" aria-hidden="true">
    <!-- ... Votre code modal existant, que je n'ai pas touché pour rester concis ... -->
    <!-- Il doit rester fonctionnel pour l'Action d'ajout/modification -->
  </div>

  <!-- ═══════════ MODAL AUTEUR (à adapter si besoin) ═══════════ -->
  <div class="modal fade" id="modalAuteur" tabindex="-1" aria-hidden="true">
    <!-- ... Votre code modal existant, que je n'ai pas touché pour rester concis ... -->
  </div>

  <!-- JS chain -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/bdb-modal-a11y.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/bdb-ui.js"></script>
  <script src="../../js/bdb-invite-guard.js"></script>
  <script src="../../js/bdb-shell.js"></script>
  <!-- Admin JS (ISO-02 : pas dans index.html) -->
  <script src="admin-bao-deepseek.js"></script>
</body>
</html>
