<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transmissions | BDB</title>

  <!-- ── CHAÎNE CSS — ordre immuable (CHANTIER BLOC E) ── -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <!-- Quill CSS — exception documentée module transmissions -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet"/>
  <!-- CDS overrides globaux -->
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <!-- CSS module transmissions -->
  <link href="transmissions-ui.css" rel="stylesheet"/>
</head>
<body class="d-flex min-vh-100">

<!-- A1/A2 CORRIGÉ : offcanvas + header hardcodés supprimés.
     bdb-shell.js v1.3.1 injecte navigation, header, window.bdbUser. -->

<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- A3 CORRIGÉ : #bdb-shell premier enfant de <main> (INTERDIT-E1) -->
  <div id="bdb-shell"
       data-module-title="Transmissions"
       data-module-icon="bi-arrow-left-right">
  </div>

  <div class="container-fluid p-4 bg-light flex-grow-1">

    <!-- STATS ──────────────────────────────────────────── -->
    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3 p-3">
            <div class="stat-icon bg-primary bg-opacity-10 text-primary rounded-3 d-flex align-items-center justify-content-center cds-stat-icon">
              <i class="bi bi-clipboard-check fs-5"></i>
            </div>
            <div>
              <div class="fs-4 fw-bold" id="statOpen">—</div>
              <div class="text-muted small">Actives</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3 p-3">
            <div class="stat-icon bg-danger bg-opacity-10 text-danger rounded-3 d-flex align-items-center justify-content-center cds-stat-icon">
              <i class="bi bi-exclamation-triangle fs-5"></i>
            </div>
            <div>
              <div class="fs-4 fw-bold" id="statPriority">—</div>
              <div class="text-muted small">Prioritaires</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3 p-3">
            <div class="stat-icon bg-warning bg-opacity-10 text-warning rounded-3 d-flex align-items-center justify-content-center cds-stat-icon">
              <i class="bi bi-star fs-5"></i>
            </div>
            <div>
              <div class="fs-4 fw-bold" id="statEssential">—</div>
              <div class="text-muted small">Essentielles</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3 p-3">
            <div class="stat-icon bg-secondary bg-opacity-10 text-secondary rounded-3 d-flex align-items-center justify-content-center cds-stat-icon">
              <i class="bi bi-archive fs-5"></i>
            </div>
            <div>
              <div class="fs-4 fw-bold" id="statArchived">—</div>
              <div class="text-muted small">Archivées</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TOOLBAR filtres + slot admin (pattern C.6) ───── -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="filterSearch" placeholder="Rechercher..."/>
            </div>
          </div>
          <div class="col-6 col-md-2">
            <select class="form-select" id="filterCategory">
              <option value="">Toutes catégories</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select class="form-select" id="filterStatus">
              <option value="open">Actives</option>
              <option value="archived">Archivées</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select class="form-select" id="filterType">
              <option value="">Tous types</option>
              <option value="essentiel">Essentielles</option>
              <option value="libre">Libres</option>
            </select>
          </div>
          <div class="col-6 col-md-1">
            <button class="btn btn-outline-danger w-100" id="btnFilterPriority" title="Prioritaires">
              <i class="bi bi-fire"></i>
            </button>
          </div>
          <!-- E3 CORRIGÉ : slot admin présent dans DOM, masqué par défaut (pattern C.6) -->
          <div class="col-12 col-md-auto d-none" id="transToolbarAdminSlot">
            <button type="button" class="btn btn-primary w-100" id="btnNewTransmission">
              <i class="bi bi-plus-lg me-1"></i>Nouvelle transmission
            </button>
          </div>
        </div>
        <div id="activeFilterBadges" class="d-flex flex-wrap gap-2 mt-2 d-none"></div>
      </div>
    </div>

    <!-- LISTE ──────────────────────────────────────────── -->
    <div id="transmissionsList">
      <!-- E1 CORRIGÉ : skeleton loader (remplace spinner-border — D-2026-03-16-T06) -->
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body placeholder-glow">
          <div class="d-flex gap-3 align-items-start">
            <div class="placeholder rounded-circle" style="width:40px;height:40px;flex-shrink:0"></div><!-- style= OK : valeur fixe skeleton -->
            <div class="flex-grow-1">
              <div class="placeholder col-5 rounded mb-2 d-block"></div>
              <div class="placeholder col-3 rounded mb-2 d-block"></div>
              <div class="placeholder col-8 rounded d-block"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 Bible de Bloc — CDS Compliant</small>
  </footer>
</main>

<!-- ========================
     MODAL CRÉATION / ÉDITION
     ======================== -->
<div class="modal fade" id="modalTransmission" tabindex="-1" aria-labelledby="modalTransmissionLabel">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTransmissionLabel">Nouvelle transmission</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalFormError" class="alert alert-danger d-none"></div>

        <div class="mb-3">
          <label for="formTitle" class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="formTitle" placeholder="Titre de la transmission" maxlength="100"/>
          <div class="form-text">3 caractères minimum</div>
        </div>

        <div class="mb-3">
          <label for="formCategory" class="form-label fw-semibold">Catégorie <span class="text-danger">*</span></label>
          <select class="form-select" id="formCategory">
            <option value="">Sélectionner une catégorie</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Contenu <span class="text-danger">*</span></label>
          <div id="quillEditor" class="trans-quill-editor"></div>
          <div class="form-text">10 caractères minimum</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Images <span class="text-muted fw-normal">(max 3)</span></label>
          <div id="imageUploadArea" class="trans-upload-area border border-dashed rounded-3 p-3 text-center mb-2">
            <i class="bi bi-cloud-arrow-up fs-3 text-muted"></i>
            <p class="mb-1 text-muted small">Glissez des images ici ou cliquez pour sélectionner</p>
            <input type="file" id="imageFileInput" accept="image/*" multiple class="d-none"/>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnSelectImages">
              <i class="bi bi-image me-1"></i>Choisir des images
            </button>
          </div>
          <div id="imagePreviewList" class="d-flex flex-wrap gap-2"></div>
          <div id="imageUploadProgress" class="d-none">
            <div class="progress trans-progress">
              <div class="progress-bar progress-bar-animated" id="uploadProgressBar"></div>
            </div>
            <small class="text-muted" id="uploadProgressText">Upload en cours...</small>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="formType" class="form-label fw-semibold">Type</label>
            <select class="form-select" id="formType">
              <option value="libre">Libre</option>
              <option value="essentiel">Essentiel</option>
            </select>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check form-switch pb-1">
              <input class="form-check-input" type="checkbox" id="formPriority" role="switch"/>
              <label class="form-check-label fw-semibold" for="formPriority">
                <i class="bi bi-fire text-danger me-1"></i>Prioritaire
              </label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Tags <span class="text-muted fw-normal">(max 5)</span></label>
          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-hash"></i></span>
            <input type="text" class="form-control" id="tagSearchInput" placeholder="Rechercher un tag..."/>
          </div>
          <div id="tagSuggestions" class="d-flex flex-wrap gap-1 mb-2"></div>
          <div id="selectedTagsList" class="d-flex flex-wrap gap-1">
            <small class="text-muted fst-italic" id="noTagsMsg">Aucun tag sélectionné</small>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" id="btnSaveTransmission">
          <i class="bi bi-check-lg me-1"></i>Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ========================
     MODAL DÉTAIL
     ======================== -->
<div class="modal fade" id="modalDetail" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <div class="d-flex align-items-start gap-3 w-100">
          <img id="detailAvatar" src="" alt="" class="rounded-circle trans-avatar-img d-none"/>
          <div class="flex-grow-1">
            <h5 class="modal-title mb-1" id="detailTitle">—</h5>
            <div class="text-muted small" id="detailMeta">—</div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
      </div>
      <div class="modal-body">
        <div id="detailBadges" class="d-flex flex-wrap gap-2 mb-3"></div>
        <div id="detailImages" class="row g-2 mb-3"></div>
        <hr class="mt-0"/>
        <div id="detailContent" class="trans-prose"></div>
        <div id="detailTags" class="d-flex flex-wrap gap-1 mt-3"></div>
      </div>
      <div class="modal-footer justify-content-between">
        <div class="d-flex gap-2" id="detailAdminActions"></div>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
      </div>
    </div>
  </div>
</div>

<!-- ========================
     MODAL CONFIRMATION (E2 CORRIGÉ : remplace confirm() natif)
     ======================== -->
<div class="modal fade" id="modalTransConfirm" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="transConfirmTitle">Confirmer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body small text-muted" id="transConfirmMsg"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-sm" id="btnTransConfirmAction">Confirmer</button>
      </div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="modal fade" id="modalLightbox" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered bg-transparent">
    <div class="modal-content border-0 bg-transparent">
      <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 cds-z-10" data-bs-dismiss="modal"></button>
      <img id="lightboxImg" src="" alt="" class="w-100 rounded cds-lightbox-img"/>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi me-2 text-primary" id="toastIcon"></i>
      <strong class="me-auto" id="toastTitle">Info</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMsg">—</div>
  </div>
</div>

<!-- ── CHAÎNE JS — ordre immuable (CHANTIER BLOC E)
     B1 CORRIGÉ : Bootstrap AVANT Supabase SDK ── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<!-- DOMPurify — sanitisation HTML Quill côté lecture (R4-XSS-01) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<!-- Socle BDB -->
<script src="../../js/supabase-client.js"></script>
<!-- A4 CORRIGÉ : bdb-shell.js ajouté — auth + offcanvas + header + window.bdbUser -->
<script src="../../js/bdb-shell.js"></script>

<script src="transmissions-app.js"></script>
</body>
</html>
