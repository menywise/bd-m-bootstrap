<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiches d'intervention | BDB</title>
  <!-- 1. Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- 2. Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- 3. CDS tokens — REMPLACER @latest par tag de release avant déploiement OVH (BLOC D.2) -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-base.css" rel="stylesheet"/>
  <!-- 4. CDS print -->
  <link href="https://cdn.jsdelivr.net/gh/menywise/BDB@latest/theme-print.css" rel="stylesheet" media="print"/>
  <!-- 5. Quill CSS (CDN spécifique module) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet"/>
  <!-- 6. CDS overrides globaux -->
  <link href="../../css/cds-overrides.css" rel="stylesheet"/>
  <!-- 7. CSS module -->
  <link href="fiches-ui.css" rel="stylesheet"/>
</head>
<body class="d-flex min-vh-100">

<main class="d-flex flex-column flex-grow-1 main-content">

  <!-- SHELL : premier enfant de <main> (INTERDIT-E1) -->
  <div id="bdb-shell"
       data-module-title="Fiches d'intervention"
       data-module-icon="bi-file-earmark-medical">
  </div>

  <div class="container-fluid p-4 bg-light flex-grow-1" id="fichesContainer">

    <!-- Filtres + slot admin (pattern C.6) -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0" id="fSearch" placeholder="Titre, description..."/>
            </div>
          </div>
          <div class="col-6 col-md-2">
            <select class="form-select" id="fStatus">
              <option value="">Tous statuts</option>
              <option value="draft">Brouillon</option>
              <option value="published">Publié</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select" id="fCategory"><option value="">Toutes catégories</option></select>
          </div>
          <div class="col-12 col-md-auto">
            <div id="activeFilters" class="d-flex flex-wrap gap-1"></div>
          </div>
          <!-- Slot admin — masqué par défaut, affiché par initFromShell() si isAdmin -->
          <div class="col-12 col-md-auto d-none" id="fichesToolbarAdminSlot">
            <button class="btn btn-primary w-100" id="btnNew">
              <i class="bi bi-plus-lg me-1"></i>Nouvelle fiche
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Liste — 3 états UI statiques (C.9) — remplacés par loadFiches() -->
    <div id="fichesList">
      <!-- loadingState — visible par défaut, remplacé par JS -->
      <div id="fichesLoadingState" class="card border-0 shadow-sm"><div class="card-body placeholder-glow">
        <div class="placeholder col-6 rounded mb-3 fs-5"></div>
        <div class="placeholder col-4 rounded mb-2"></div>
        <div class="placeholder col-8 rounded mb-2"></div>
        <div class="placeholder col-3 rounded"></div>
      </div></div>
      <!-- errorState — masqué, affiché par cdsShowGridError -->
      <div id="fichesErrorState" class="cds-error-state col-12 d-none">
        <i class="bi bi-wifi-off cds-error-icon"></i>
        <div class="cds-error-title">Données non chargées</div>
        <div class="cds-error-msg">Impossible de contacter le serveur. Vérifiez votre connexion.</div>
      </div>
      <!-- emptyState — masqué, affiché si 0 résultat -->
      <div id="fichesEmptyState" class="card border-0 shadow-sm d-none"><div class="card-body text-center py-5 text-muted">
        <i class="bi bi-file-earmark-medical fs-1 d-block mb-3"></i>
        <p class="mb-0">Aucune fiche trouvée</p>
      </div></div>
    </div>

  </div>

  <footer class="mt-auto py-3 border-top text-center text-muted bg-white">
    <small>&copy; 2026 Bible de Bloc — CDS Compliant</small>
  </footer>
</main>

<!-- =====================
     MODAL FICHE (CREATE/EDIT)
     ===================== -->
<div class="modal fade" id="modalFiche" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalFicheLabel">Nouvelle fiche</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="fFormError" class="alert alert-danger d-none"></div>
        <div class="row g-3">

          <!-- Titre -->
          <div class="col-12">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="fTitre" placeholder="Nom de l'intervention"/>
          </div>

          <!-- Images -->
          <div class="col-12">
            <label class="form-label fw-semibold">Images <span class="text-muted fw-normal">(max 3)</span></label>
            <div id="fUploadArea" class="fiche-upload-area border rounded-3 p-3 text-center mb-2">
              <i class="bi bi-cloud-arrow-up fs-3 text-muted d-block"></i>
              <p class="small text-muted mb-1">Glissez ou cliquez</p>
              <input type="file" id="fFileInput" accept="image/*" multiple class="d-none"/>
              <button type="button" class="btn btn-sm btn-outline-secondary" id="fBtnImages"><i class="bi bi-image me-1"></i>Choisir</button>
            </div>
            <div id="fImagePreviews" class="d-flex flex-wrap gap-2"></div>
          </div>

          <!-- Description (Quill) -->
          <div class="col-12">
            <label class="form-label fw-semibold">Description</label>
            <div id="fQuill" class="fiches-quill-editor"></div>
          </div>

          <!-- Catégorie + Durée -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Catégorie</label>
            <select class="form-select" id="fFormCategory"><option value="">— Sélectionner —</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Durée estimée (min)</label>
            <input type="number" class="form-control" id="fDuree" placeholder="60" min="1"/>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Statut</label>
            <select class="form-select" id="fFormStatus">
              <option value="draft">Brouillon</option>
              <option value="published">Publié</option>
            </select>
          </div>

          <!-- Étapes -->
          <div class="col-12">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <label class="form-label fw-semibold mb-0">Étapes de l'intervention</label>
              <button type="button" class="btn btn-sm btn-outline-primary" id="fBtnAddEtape">
                <i class="bi bi-plus-lg me-1"></i>Ajouter une étape
              </button>
            </div>
            <div id="fEtapes" class="d-flex flex-column gap-2">
              <p class="text-muted small text-center py-3 mb-0" id="fEtapesEmpty">Aucune étape.</p>
            </div>
          </div>

          <!-- Tags -->
          <div class="col-12">
            <label class="form-label fw-semibold">Tags <span class="text-muted fw-normal">(max 5)</span></label>
            <div class="d-flex gap-2 mb-2">
              <input type="text" class="form-control" id="fTagSearch" placeholder="Rechercher un tag..."/>
            </div>
            <div id="fTagResults" class="d-flex flex-wrap gap-1 mb-2"></div>
            <div id="fSelectedTags" class="d-flex flex-wrap gap-1">
              <span class="text-muted small">Aucun tag sélectionné</span>
            </div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" id="fBtnSave"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- =====================
     MODAL DÉTAIL (lecture)
     ===================== -->
<div class="modal fade" id="modalFicheView" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalViewLabel">Fiche</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalViewBody">
        <!-- Skeleton loader (remplace spinner — D-2026-03-16-T06) -->
        <div class="placeholder-glow p-3">
          <div class="placeholder col-8 rounded mb-3 fs-5"></div>
          <div class="placeholder col-5 rounded mb-2"></div>
          <div class="placeholder col-7 rounded mb-2"></div>
          <div class="placeholder col-4 rounded"></div>
        </div>
      </div>
      <div class="modal-footer" id="modalViewFooter"></div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="modal fade" id="modalLightbox" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content border-0 bg-transparent">
      <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 cds-z-10" data-bs-dismiss="modal"></button>
      <img id="lightboxImg" src="" alt="" class="w-100 rounded cds-lightbox-img"/>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastInfo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi me-2 text-primary" id="toastIcon"></i>
      <strong class="me-auto" id="toastTitle">Info</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastMsg">—</div>
  </div>
</div>

<!-- JS BLOC E — ordre obligatoire -->
<!-- 1. Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- 2. Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- 3. Quill (CDN spécifique module) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<!-- DOMPurify — sanitisation HTML Quill côté lecture (R4-XSS-01) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<!-- 4. Socle BDB -->
<script src="../../js/supabase-client.js"></script>
<script src="../../js/bdb-shell.js"></script>

<script src="fiches-app.js"></script>
</body>
</html>
