<!DOCTYPE html>
<!-- DBM | Surface: SYSTEME | Auth: aucune | Shell: non -->
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="js/bdb-pwa.js"></script>
  <title>Accès refusé | Des Blocs & Moi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- DBM theme (remplace theme-base + cds-overrides) -->
  <link href="./css/dbm-theme.css" rel="stylesheet"/>
  <link href="./css/bdb-ui-kit.css" rel="stylesheet"/><style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f3f5;
    }
    .unauth-footer { font-size: .75rem; }
    .unauth-card {
      max-width: 420px;
      width: 100%;
      border-radius: 1rem;
      border: none;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .unauth-icon {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 1rem;
    }
    .unauth-icon--blocked  { background: #fff3cd; color: #856404; }
    .unauth-icon--mismatch { background: #cfe2ff; color: #084298; }
  </style>
</head>
<body>

<div class="card unauth-card p-4 text-center">

  <div id="unauthIcon" class="unauth-icon"></div>
  <h5 class="fw-bold mb-2" id="unauthTitle"></h5>
  <p class="text-muted small mb-4" id="unauthMsg"></p>

  <a id="unauthBtn" href="#" class="btn btn-module w-100"></a>

  <p class="text-muted mt-3 mb-0 unauth-footer">
    <i class="bi bi-hospital me-1"></i>Des Blocs & Moi — Bloc Ortho-Neuro
  </p>
</div>

<script>
(function () {
  var reason = new URLSearchParams(window.location.search).get('reason') || 'intrus';

  var STATES = {
    'intrus': {
      iconCls : 'unauth-icon--blocked',
      icon    : 'bi-shield-x',
      title   : 'Acc\u00e8s non disponible',
      msg     : 'BDB est un outil interne r\u00e9serv\u00e9 \u00e0 l\u2019\u00e9quipe du bloc. Si vous faites partie de l\u2019\u00e9quipe et que vous pensez recevoir ce message par erreur, parlez-en \u00e0 votre responsable de bloc \u2014 il pourra r\u00e9gulariser votre acc\u00e8s rapidement.',
      btnText : 'Retour \u00e0 l\u2019accueil',
      btnHref : 'site/index.html'
    },
    'email-non-lie': {
      iconCls : 'unauth-icon--mismatch',
      icon    : 'bi-person-x',
      title   : 'Une derni\u00e8re \u00e9tape',
      msg     : 'Votre adresse Google n\u2019est pas encore reli\u00e9e \u00e0 votre compte BDB. C\u2019est une op\u00e9ration simple que votre administrateur peut faire en quelques secondes. Une fois fait, vous pourrez vous connecter avec Google sans effort.',
      btnText : 'Retour \u00e0 la connexion',
      btnHref : 'login.html'
    }
  };

  var state = STATES[reason] || STATES['intrus'];

  var iconEl  = document.getElementById('unauthIcon');
  var titleEl = document.getElementById('unauthTitle');
  var msgEl   = document.getElementById('unauthMsg');
  var btnEl   = document.getElementById('unauthBtn');

  iconEl.className    = 'unauth-icon ' + state.iconCls;
  iconEl.innerHTML    = '<i class="bi ' + state.icon + '"></i>';
  titleEl.textContent = state.title;
  msgEl.textContent   = state.msg;
  btnEl.textContent   = state.btnText;
  btnEl.href          = state.btnHref;
}());
</script>

</body>
</html>
