<!--
  PROJECT  : Des Blocs & Moi (DBM)
  FILE     : maintenance.html
  MODULE   : Racine
  DATE     : 2026-04-13
  AUTEUR   : Manu + Claude
  RÔLE     : Page affichée pendant une maintenance planifiée.
             Standalone — zéro auth, zéro Supabase, zéro bdb-shell.
             Fonctionnelle sans réseau (PWA).
  USAGE    : Redirect via sw.js ou redirect DNS pendant maintenance.
  CHAÎNE CSS :
    1. Bootstrap 5.3.2
    2. Bootstrap Icons 1.11.1
    3. theme.css (CDN menywise/DBM hash figé)
-->
<!DOCTYPE html>
<!-- DBM | Surface: SYSTEME | Auth: aucune | Shell: non -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="../js/bdb-pwa.js"></script>
  <title>En maintenance | Des Blocs &amp; Moi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- DBM theme (remplace theme-base + cds-overrides) -->
  <link href="./css/dbm-theme.css" rel="stylesheet"/>
  <link href="./css/bdb-ui-kit.css" rel="stylesheet"/><style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bs-light); }
    .maintenance-icon { font-size: 4rem; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .6; transform: scale(.95); }
    }
    .maintenance-card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="maintenance-card">

    <i class="bi bi-cone-striped text-warning maintenance-icon d-block mb-4"></i>

    <h1 class="h3 fw-bold mb-2">Maintenance en cours</h1>
    <p class="text-muted mb-4">
      BDB est temporairement indisponible — une mise à jour est en cours.
      Tout sera de retour dans quelques instants.
    </p>

    <div class="alert alert-warning d-flex align-items-center gap-2 text-start mb-4">
      <i class="bi bi-clock flex-shrink-0"></i>
      <span class="small">
        La maintenance est planifiée et limitée dans le temps.
        Tes données sont en sécurité — rien n'est perdu.
      </span>
    </div>

    <button type="button" class="btn btn-module" id="btnReloadMaintenance">
      <i class="bi bi-arrow-clockwise me-2"></i>Réessayer
    </button>

    <p class="text-muted small mt-4 mb-0">
      Une question urgente ?
      <a href="mailto:contact@bdb.app" class="text-muted">Contacte l'équipe BDB</a>
    </p>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>document.getElementById('btnReloadMaintenance').addEventListener('click', () => window.location.reload());</script>
</body>
</html>
