<!DOCTYPE html>
<!-- DBM | Surface: SYSTEME | Auth: aucune | Shell: non -->
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="js/bdb-pwa.js"></script>
  <title>Hors ligne | Des Blocs & Moi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- DBM theme (remplace theme-base + cds-overrides) -->
  <link href="./css/dbm-theme.css" rel="stylesheet"/>
  <link href="./css/bdb-ui-kit.css" rel="stylesheet"/><style>
    body { background-color: #f8f9fa; }
    .offline-wrap { min-height: 100vh; }
    .offline-card { max-width: 480px; }
  </style>
</head>
<body>

<div class="d-flex align-items-center justify-content-center offline-wrap">
  <div class="container py-5 text-center offline-card">

    <i class="bi bi-wifi-off display-1 text-muted mb-4 d-block"></i>

    <h1 class="h3 fw-bold mb-2">Vous êtes hors ligne</h1>
    <p class="text-muted mb-4">
      Aucune connexion réseau détectée.<br>
      Vérifiez votre connexion Wi-Fi ou données mobiles, puis réessayez.
    </p>

    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
      <button type="button" class="btn btn-module" id="btn-retry">
        <i class="bi bi-arrow-clockwise me-1"></i>Réessayer
      </button>
      <a href="index.html" class="btn btn-outline-secondary">
        <i class="bi bi-house me-1"></i>Retour accueil
      </a>
    </div>

  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>document.getElementById('btn-retry').addEventListener('click', () => location.reload());</script>
</body>
</html>
